name: Fuzz (nightly)

# Property-based fuzzing of the stream field contract, sharded and run at high example counts.
#
# Split from the per-PR `stream-contract` job on purpose: pull requests get a fast deterministic
# gate, while depth is bought here where latency does not matter. The Hypothesis example database
# is cached per shard, so each night starts from the previously-found interesting inputs and
# coverage compounds instead of restarting from scratch.
#
# Offline by design — no Redis, no Docker, no benchmark fleet — so a harness defect is catchable
# here rather than only by consuming runner time.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      max_examples:
        description: 'Hypothesis examples per property per shard'
        required: false
        default: '20000'
        type: string

permissions:
  contents: read

concurrency:
  group: fuzz-nightly
  cancel-in-progress: false

jobs:
  fuzz:
    name: "fuzz shard ${{ matrix.shard }}/8"
    runs-on: ubuntu-latest
    strategy:
      # One shard failing must never hide the others: every shard reports independently.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install test deps
        run: pip install pytest hypothesis pytest-timeout

      # Per-shard cache: each shard keeps its own corpus of interesting inputs. restore-keys lets
      # a new run start from the most recent corpus for that shard rather than empty.
      - name: Restore Hypothesis example database
        uses: actions/cache@v4
        with:
          path: .hypothesis
          key: hypothesis-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: |
            hypothesis-${{ matrix.shard }}-

      - name: Fuzz
        env:
          HYPOTHESIS_MAX_EXAMPLES: ${{ inputs.max_examples || '20000' }}
        # --hypothesis-seed, not PYTHONHASHSEED: the latter does not seed Hypothesis at all, so the
        # shards diverged only by run-to-run randomness and a failure could not be replayed. With an
        # explicit per-shard seed the shards genuinely explore different inputs AND the shard number
        # is enough to reproduce whatever it found.
        run: |
          python -m pytest utils/tests/test_stream_contract_fuzz.py \
            -p no:randomly -q --timeout=1800 \
            --hypothesis-seed=${{ matrix.shard }}

      - name: Upload falsifying examples
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hypothesis-shard-${{ matrix.shard }}
          path: .hypothesis
          if-no-files-found: ignore
