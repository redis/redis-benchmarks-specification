spec:
  setups:
  - name: oss-standalone
    type: oss-standalone
    redis_topology:
      primaries: 1
      replicas: 0
    resources:
      requests:
        cpus: "1"
        memory: "10g"

  - name: oss-standalone-with-redisearch
    type: oss-standalone
    redis_topology:
      primaries: 1
      replicas: 0
