version: 0.4
name: memtier_benchmark-12Mkeys-string-1KiB-bgsave-duration
description: |
  Standalone BGSAVE-duration benchmark: preloads 12M string keys with
  1024-byte compressible values (~15GB resident, memtier's default data
  pattern -- not -R random bytes -- the highly-compressible extreme, not
  a realistic middle ground; -R would be the incompressible extreme
  instead). rdbcompression is left at its default (yes) so LZF actually
  runs against real, compressible data; the resulting RDB is ~469MB on
  disk (~32x), unlike the incompressible crc64-isolation spec family
  (e.g. 140Kkeys-load-string-with-128KiB-values-randomdata-replica-only),
  which pins rdbcompression off. save is pinned to "" so periodic
  autosave never fires -- the only BGSAVE in the measured window is the
  one this spec explicitly issues.

  Distinct from the existing 3Mkeys-set family, which intentionally
  times fork/CoW cost *under* sustained write pressure with incompressible
  data (a different, harder-to-isolate signal, and a different I/O
  profile -- real GBs written to disk vs. this spec's ~469MB). This spec
  has no concurrent write traffic during the measured BGSAVE, so the
  number reflects pure save-path cost: fork + RDB serialization + LZF
  compression + disk write.

  BGSAVE forks and replies "Background saving started" immediately --
  client-observed latency is fork time, not save time. dbconfig.wait_for_bgsave
  makes the coordinator poll INFO persistence's rdb_bgsave_in_progress
  after the client run finishes, blocking until the save actually
  completes, then confirms a save genuinely happened in that window
  (rdb_last_save_time strictly advanced past a pre-run snapshot AND
  rdb_last_bgsave_status is ok -- rdb_bgsave_in_progress==0 alone
  doesn't prove a save ran; a fresh/never-saved server reads 0 too)
  before injecting RdbLastBgsaveTimeSec (whole seconds -- Redis's own
  resolution) and RdbLastForkUsec (microseconds, from INFO's *stats*
  section -- "the last fork of any kind," not BGSAVE-specific in
  general, but exact here since this topology has no other fork source:
  no AOF, no replicas). If confirmation fails, nothing is injected and
  the export is skipped entirely, rather than letting the standard
  Ops/sec/p50.00/p99.00 series (see the exporter block) reach TimeSeries
  from a run already declared failed. bgsave_timeout_seconds is set
  explicitly to 180 (~7x margin over the measured save).

  Measured directly on this exact dataset shape: BGSAVE takes ~26.2s
  (rdb_last_bgsave_time_sec=26), so rdb_last_bgsave_time_sec's
  whole-second resolution is ~3.8% single-run quantization -- comfortably
  inside the ~20-33% class of BGSAVE regression this spec exists to
  detect. The clientconfig's BGSAVE fork-ack latency (what
  validate_benchmark_metrics() sees, since that gate runs before this
  spec's own wait/confirm/inject logic) measured ~349ms at this scale --
  fork() cost scales with resident memory, so this number is NOT stable
  across dataset sizes and shouldn't be assumed constant if this spec is
  ever rescaled. That's real headroom above the validator's <1 QPS
  floor today (Ops/sec=2.87, confirmed against the real validator), but
  worth re-checking directly (not assumed) before any further rescale,
  since a validator failure here shares the same tear-down-skipping
  container-leak risk this PR's own new code was written to avoid.

  A pre-existing, spec-agnostic cleanup gate is also worth flagging here
  specifically: the coordinator's server data directory (holding
  server.rdb) is only removed when test_result is True, so a failed run
  of this spec leaves the full ~469MB dump.rdb on disk rather than the
  few KB other specs' failures typically leave -- relevant when
  reasoning about fleet disk usage from repeated failures.
dbconfig:
  configuration-parameters:
    save: '""'
    maxmemory-policy: noeviction
  check:
    keyspacelen: 12000000
  preload_tool:
    run_image: redislabs/memtier_benchmark:edge
    tool: memtier_benchmark
    arguments: --data-size 1024 --ratio 1:0 -n allkeys --pipeline 50 --key-maximum
      12000000 --key-pattern P:P --key-minimum 1 --hide-histogram -t 8 -c 25
  resources:
    requests:
      memory: 20g
  # Distinct from the existing 3Mkeys-string-1KiB-size dataset (used by
  # memtier_benchmark-3Mkeys-string-get-with-1KiB-values-400_conns.yml):
  # that sibling also omits -R (equally compressible) and only differs in
  # --data-size (1000 vs this spec's 1024) -- the "-1KiB-size" name would
  # otherwise misleadingly suggest compressibility is what's different.
  # dataset_name doubles as a preload-reuse key in __runner__/runner.py,
  # so it must stay a distinct string regardless.
  dataset_name: 12Mkeys-string-1024B-size
  dataset_description: |
    12 million string keys, each with a 1024-byte compressible value
    (memtier's default data pattern, not -R random bytes -- the
    highly-compressible extreme, not a realistic middle ground) --
    ~15GB resident (measured), compressing to ~469MB on disk (~32x).
    Measured BGSAVE duration on this exact shape is ~26s, sized so
    rdb_last_bgsave_time_sec's whole-second resolution (~3.8%
    quantization at this scale) sits comfortably inside the ~20-33%
    BGSAVE regression class this spec exists to detect.
  wait_for_bgsave: true
  # ~7x margin over the ~26s measured save -- deliberately smaller than
  # wait_for_bgsave_completion()'s own 300s default so a genuinely stuck
  # or catastrophically slow BGSAVE (versus normal fleet/platform
  # variance) fails this test in under 3 minutes instead of 5.
  bgsave_timeout_seconds: 180
  # The coordinator's automated actionable-PR regression comment defaults to
  # ALL_STATS.Totals.Ops/sec on every spec, with no per-spec override before
  # this -- for this spec that's a single BGSAVE fork-ack sample, which
  # scales with dataset RSS rather than anything this spec is meant to
  # measure (~4ms at 3M keys vs ~349ms at this spec's actual 12M-key scale,
  # an ~87x swing from a dataset resize alone). Left as the default,
  # ~10%-threshold Ops/sec regression checks against redis/redis PRs would
  # fire on noise unrelated to BGSAVE performance. regression_metric_name/
  # regression_metric_mode redirect that same automated table at the metric
  # this spec actually exists to track, instead of suppressing regression
  # detection for this spec entirely.
  regression_metric_name: ALL_STATS.Totals.RdbLastBgsaveTimeSec
  regression_metric_mode: lower-better
tested-commands:
- bgsave
redis-topologies:
- oss-standalone
build-variants:
- gcc:15.2.0-amd64-debian-bookworm-default
- gcc:15.2.0-arm64-debian-bookworm-default
- dockerhub
clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: --command "BGSAVE" --command-key-pattern="R" -n 1 -c 1 -t 1 --hide-histogram
  resources:
    requests:
      cpus: '2'
      memory: 1g
tested-groups:
- server
exporter:
  redistimeseries:
    # merge_default_and_config_metrics() EXTENDS defaults.yml rather than
    # replacing it, so the standard Ops/sec / Latency / p50.00 / p99.00
    # series also get pushed under this test name, off the single BGSAVE
    # fork-ack reply (measured ~4ms at 3M keys, ~349ms at this spec's
    # actual 12M-key scale -- fork() cost scales with resident memory).
    # That degenerate number is NOT just harmless dashboard noise:
    # - The coordinator's automated actionable-PR regression comment
    #   (self_contained_coordinator.py, the "regression part" block) would
    #   default to it too -- fixed via dbconfig.regression_metric_name/
    #   regression_metric_mode below, which redirect that SAME automated
    #   table at RdbLastBgsaveTimeSec instead, so redis/redis PR runs get
    #   real BGSAVE-duration regression detection rather than either noise
    #   or no detection at all.
    # - The manual redis-benchmarks-spec-compare CLI is a separate code
    #   path (reads --metric_name from its own args, not from dbconfig) and
    #   is NOT covered by that fix -- it still defaults --metric_name to
    #   ALL_STATS.Totals.Ops/sec, so always pass
    #   --metric_name RdbLastBgsaveTimeSec (or RdbLastForkUsec) explicitly
    #   when comparing this spec manually.
    # Issuing BGSAVE directly from the coordinator instead of through a
    # memtier client would remove the degenerate Ops/sec at the source
    # instead of routing around it twice, but reworking the client/tested-
    # commands shape is a larger change than this PR -- deferred.
    metrics:
    - $."ALL STATS".Totals.RdbLastBgsaveTimeSec
    - $."ALL STATS".Totals.RdbLastForkUsec
priority: 50
