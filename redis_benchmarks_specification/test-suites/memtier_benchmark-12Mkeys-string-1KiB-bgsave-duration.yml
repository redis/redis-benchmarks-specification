version: 0.4
name: memtier_benchmark-12Mkeys-string-1KiB-bgsave-duration
description: |
  Standalone BGSAVE-duration benchmark: preloads 12M string keys with
  1024-byte compressible values (~15GB resident, memtier's default
  data pattern -- not -R random bytes -- so LZF actually does real
  compression work), then issues a single explicit BGSAVE and times it
  via Redis's own INFO persistence fields (rdb_last_bgsave_time_sec,
  latest_fork_usec), not client-observed latency.

  Measured directly against this exact dataset shape (local build, one
  BGSAVE timed by polling rdb_bgsave_in_progress): ~26.2s wall-clock,
  rdb_last_bgsave_time_sec=26, RDB compresses to 469MB on disk from
  15GB resident (~32x). Started at 3M keys (~5.6s measured), which put
  rdb_last_bgsave_time_sec's whole-second resolution at a real ~20%
  single-run quantization -- right at the bottom edge of the ~20-33%
  BGSAVE regression class this spec exists to validate, not comfortably
  inside it. Scaled to 12M keys instead of shipping at that edge:
  quantization at ~26s is ~3.8% (1/26), well below the detection band,
  with margin to spare. Precedent for this scale already exists in this
  repo (the 20Mkeys-load-string-with-1KiB-values-replica-only family
  uses 25g memory at ~21GB resident); this spec's 12M/15GB sits below
  that.

  Rescaling to 12M keys has a real, measured side effect worth stating
  plainly: fork() cost (CoW page-table setup) scales with resident
  memory, not just with dataset byte count on disk. The clientconfig's
  BGSAVE fork-ack latency -- the value validate_benchmark_metrics()
  actually sees, since that gate runs before this spec's own
  wait/confirm/inject logic -- was ~4ms at the original 3M-key/3.75GB
  scale but measured ~349ms at this shipped 12M-key/15GB scale (fed
  through the real validator directly: Ops/sec=2.87, is_valid=True).
  That's real headroom above the validator's <1 QPS floor, but a
  materially thinner margin than the smaller scale had -- if this spec
  is ever scaled up further, or if some platform's fork() is
  meaningfully slower than this measurement's box, that floor gets
  closer. A validator failure here hits the same pre-existing
  continue-past-tear-down path as any other spec's metric-validation
  failure (out of scope for this PR, see the exporter block below for
  the analogous, already-fixed issue on this spec's own new code), so
  keep this margin in mind before scaling the dataset any further.

  Separately, a pre-existing, spec-agnostic cleanup gate is worth
  flagging for this spec specifically: the coordinator's server data
  directory (holding server.rdb) is only removed when test_result is
  True. Most specs leave a few KB of logs behind on a failed run; this
  one leaves the full ~469MB dump.rdb, since a failure here (unconfirmed
  BGSAVE, or the validator issue above) doesn't change what's already
  on disk. Not fixed here -- same shared, out-of-scope cleanup path --
  but worth knowing when reasoning about fleet disk usage from repeated
  failures of this spec specifically.

  Built to give a clean, write-quiescent BGSAVE duration number --
  distinct from the existing 3Mkeys-set family, which intentionally
  times fork/CoW cost *under* sustained write pressure (a different,
  harder-to-isolate signal). Here there is no concurrent write traffic
  during the measured BGSAVE, so the number reflects pure save-path
  cost: fork + RDB serialization + LZF compression + disk write, with
  no page-dirtying/CoW noise superimposed.

  BGSAVE forks and replies "Background saving started" immediately --
  client-observed latency is fork time, not save time (confirmed
  directly: 4.1ms client-side against a real ~1s save). dbconfig.wait_for_bgsave
  makes the coordinator poll INFO persistence's rdb_bgsave_in_progress
  after the client run finishes, blocking until the save Redis is
  actually running completes, then confirms a save genuinely happened
  in that window (rdb_last_save_time strictly advanced past a pre-run
  snapshot AND rdb_last_bgsave_status is ok -- rdb_bgsave_in_progress==0
  alone doesn't prove a save ran; a fresh/never-saved server reads 0
  too) before injecting RdbLastBgsaveTimeSec (whole seconds -- Redis's
  own resolution) and RdbLastForkUsec (microseconds, from INFO's
  *stats* section -- "the last fork of any kind," not BGSAVE-specific
  in general, but exact here since this spec's topology has no other
  fork source: no AOF, no replicas) into the exported metrics. If that
  confirmation fails (timeout, or no save detected), nothing is
  injected and the export itself is skipped -- exporter_datasink_common()
  has no concept of test failure and would otherwise push the standard
  Ops/sec/p50.00/p99.00 series (see the exporter block below) under
  this test name from a run already declared failed, which is worse
  than a hole. (The coordinator's own poll-loop timer has finer, 200ms
  resolution than Redis's whole-second field, but is not exported: the
  poll only starts after container teardown -- topdown/profiler stop,
  results parsing -- which can easily outlast a write-quiescent BGSAVE,
  so it would measure coordinator teardown latency more than BGSAVE
  itself.)

  save is pinned to "" so periodic autosave never fires -- the only
  BGSAVE in the measured window is the one this spec explicitly issues.
  rdbcompression is left at its default (yes) so LZF actually runs,
  unlike the crc64-isolation spec
  (140Kkeys-load-string-with-128KiB-values-randomdata-replica-only)
  which deliberately disables it. Values use memtier's default data
  pattern (not -R random bytes), which is the highly-compressible
  extreme, not a "representative" middle ground; -R would be the
  incompressible extreme instead. This spec deliberately sits at the
  compressible end since that is where lzf_compress's own cost is
  largest and most visible -- confirmed directly: the resulting RDB
  measured 469MB on disk against a 15GB resident dataset (~32x), so
  LZF is doing real, substantial work rather than a few bytes of no-op
  compression attempts.
dbconfig:
  configuration-parameters:
    save: '""'
    maxmemory-policy: noeviction
  check:
    keyspacelen: 12000000
  preload_tool:
    run_image: redislabs/memtier_benchmark:edge
    tool: memtier_benchmark
    arguments: --data-size 1024 --ratio 1:0 -n allkeys --pipeline 50 --key-maximum
      12000000 --key-pattern P:P --key-minimum 1 --hide-histogram -t 8 -c 25
  resources:
    requests:
      memory: 20g
  # Distinct from the existing 3Mkeys-string-1KiB-size dataset (used by
  # memtier_benchmark-3Mkeys-string-get-with-1KiB-values-400_conns.yml):
  # that sibling also omits -R (equally compressible) and only differs in
  # --data-size (1000 vs this spec's 1024) -- the "-1KiB-size" name would
  # otherwise misleadingly suggest compressibility is what's different.
  # dataset_name doubles as a preload-reuse key in __runner__/runner.py,
  # so it must stay a distinct string regardless.
  dataset_name: 12Mkeys-string-1024B-size
  dataset_description: |
    12 million string keys, each with a 1024-byte compressible value
    (memtier's default data pattern, not -R random bytes -- the
    highly-compressible extreme, not a realistic middle ground) --
    ~15GB resident (measured), compressing to ~469MB on disk (~32x).
    Measured BGSAVE duration on this exact shape is ~26s, sized so
    rdb_last_bgsave_time_sec's whole-second resolution (~3.8%
    quantization at this scale) sits comfortably below the ~20-33%
    BGSAVE regression class this spec exists to validate, rather than
    at its edge (an earlier 3M-key/~5.6s version measured ~20%
    quantization -- see the top-level description for that history).
  wait_for_bgsave: true
  # ~7x margin over the ~26s measured save -- deliberately smaller than
  # wait_for_bgsave_completion()'s own 300s default so a genuinely stuck
  # or catastrophically slow BGSAVE (versus normal fleet/platform
  # variance) fails this test in under 3 minutes instead of 5.
  bgsave_timeout_seconds: 180
tested-commands:
- bgsave
redis-topologies:
- oss-standalone
build-variants:
- gcc:15.2.0-amd64-debian-bookworm-default
- gcc:15.2.0-arm64-debian-bookworm-default
- dockerhub
clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: --command "BGSAVE" --command-key-pattern="R" -n 1 -c 1 -t 1 --hide-histogram
  resources:
    requests:
      cpus: '2'
      memory: 1g
tested-groups:
- server
exporter:
  redistimeseries:
    # merge_default_and_config_metrics() EXTENDS defaults.yml rather than
    # replacing it, so the standard Ops/sec / Latency / p50.00 / p99.00
    # series also get pushed under this test name, off the single ~4ms
    # BGSAVE fork-ack reply. This is NOT just harmless dashboard noise:
    # redis-benchmarks-spec-compare defaults --metric_name to
    # ALL_STATS.Totals.Ops/sec, so a compare run against this spec WITHOUT
    # an explicit --metric_name would regress-check a one-sample fork-ack
    # number, not save duration. Always pass
    # --metric_name RdbLastBgsaveTimeSec (or RdbLastForkUsec) explicitly
    # when comparing this spec. Issuing BGSAVE directly from the
    # coordinator instead of through a memtier client (dropping the
    # degenerate Ops/sec entirely and getting a clean sub-second wait
    # timer as a side effect) would fix this at the source, but is a
    # larger change than this spec -- accepted as a known limitation of
    # the memtier-client-issues-BGSAVE shape rather than expanding scope.
    metrics:
    - $."ALL STATS".Totals.RdbLastBgsaveTimeSec
    - $."ALL STATS".Totals.RdbLastForkUsec
priority: 50
