version: 0.4
name: memtier_benchmark-3keys-zset-300-500-elements-with-set-400-members-zintercard
description: 'Runs memtier_benchmark issuing ZINTERCARD over 3 inputs: sorted set bt:1 of 300
  members m:1..m:300, plain SET ''st'' of 400 members m:1..m:400 (ZINTERCARD accepts sets), and sorted
  set bt:2 of 500 members m:1..m:500. Inputs are sorted by cardinality, so bt:1 is iterated, the SET
  is the second input and bt:2 the third. Overlap is 100% of bt:1 (3-5 byte members); the reply is
  always the integer 300. The second input receives a lookup for every candidate, later inputs only
  for survivors. ZINTERCARD rather than ZINTER keeps output construction out of the call, so the SET
  probes are not diluted. A coverage point for a second input that is not a sorted set, not a
  one-axis delta against another suite. It covers numkeys=3, between the existing 2-key and 8-key
  suites. Encoding: bt:1/bt:2 = skiplist through 8.10.x, btree (OBJ_ENCODING_BTREE) from 8.12 (300
  and 500 elements, above zset-max-listpack-entries 128); st = hashtable (400 members, above
  set-max-listpack-entries 128). Load: memtier defaults (4 threads x 50 clients, pipeline 1), the
  same as the existing ZINTER/ZINTERCARD suites so results line up with them. Unlike the existing
  2-key and 8-key ZINTERCARD suites, which preload 64 keys, this suite preloads only the 3 keys it
  queries. Metric of interest: Ops/sec.'
dbconfig:
  configuration-parameters:
    save: '""'
  check:
    keyspacelen: 3
  resources:
    requests:
      memory: 1g
  init_lua: |
    -- bt:1: 300-member sorted set m:1..m:300. st: a plain SET of 400 members
    -- m:1..m:400 (hashtable; above set-max-listpack-entries 128). bt:2: 500-member
    -- sorted set m:1..m:500. Sorted by cardinality the inputs are bt:1, st, bt:2,
    -- so bt:1 is iterated and the SET is the second input; intersection = 300.
    for m = 1, 300 do
      redis.call('ZADD', 'bt:1', m, 'm:' .. m)
    end
    for m = 1, 400 do
      redis.call('SADD', 'st', 'm:' .. m)
    end
    for m = 1, 500 do
      redis.call('ZADD', 'bt:2', m, 'm:' .. m)
    end
    return 1
  dataset_name: 3keys-zset-300-500-plus-set-400-hashtable
  dataset_description: bt:1 = zset m:1..m:300; st = hashtable set m:1..m:400; bt:2 = zset
    m:1..m:500. Intersection = 300.
tested-commands:
- zintercard
redis-topologies:
- oss-standalone
build-variants:
- gcc:15.2.0-amd64-debian-bookworm-default
- gcc:15.2.0-arm64-debian-bookworm-default
- dockerhub
clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: --command="ZINTERCARD 3 bt:1 st bt:2 LIMIT 0"  --hide-histogram --test-time 120
  resources:
    requests:
      cpus: '4'
      memory: 2g
tested-groups:
- sorted-set
priority: 131
