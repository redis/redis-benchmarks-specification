version: 0.4
name: memtier_benchmark-1key-hash-hset-2-fields-json-vs-hashes
description: |
  Measures Ops/sec for HSET of two 6-byte fields on one key (`HSET key_hash field1 value1 field2
  value2`), the hash baseline RedisJSON compares the two-field JSON.SET against.
  Report throughput for this loaded client population (16 connections, 8 per thread x 2 threads,
  pipeline 1, 120-second measured phase); sampled response-latency percentiles describe the same load.
  The client shape is the one of the RedisJSON spec (redis-benchmark -c 16 --threads 2 -P 1); memtier
  replaces redis-benchmark so the rbs runner can drive it.
  Port of RedisJSON tests/benchmarks/json_vs_hashes_hset_key_simple.yml; no dataset. The init command
  issues the measured command once: an error reply aborts the suite. The suite needs no module.

dbconfig:
  configuration-parameters:
    save: '""'
  resources:
    requests:
      memory: 1g
  init_commands:
    - ['HSET', 'key_hash', 'field1', 'value1', 'field2', 'value2']

tested-groups:
- hash

tested-commands:
- hset

redis-topologies:
- oss-standalone

build-variants:
- gcc:15.2.0-amd64-debian-bookworm-default
- gcc:15.2.0-arm64-debian-bookworm-default
- dockerhub

clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: >
    -c 8 -t 2
    --distinct-client-seed
    --pipeline=1
    --print-percentiles=50,90,95,99
    --run-count=1
    --test-time=120
    --command="HSET key_hash field1 value1 field2 value2"
    --command-key-pattern=R
    --hide-histogram
  resources:
    requests:
      cpus: '4'
      memory: 2g

priority: 150
