version: 0.4
name: memtier_benchmark-1Mkeys-bitmap-setbit-regrow-pipeline-10-strings-roaring-on
description: >
  String-data variant of memtier_benchmark-1Mkeys-bitmap-setbit-regrow-pipeline-10, run with
  bitmap-default-roaring yes. The preload is unchanged, so the keys start as plain strings, as
  they would on a dataset created before the config was enabled; SETBIT converts a plain
  string to a Roaring bitmap, and the interleaved SET turns the key back into a string, so the
  run keeps measuring the string-to-Roaring conversion. Same keyspace and client arguments as
  the string spec, which runs with the config off.
dbconfig:
  configuration-parameters:
    save: '""'
    bitmap-default-roaring: 'yes'
  check:
    keyspacelen: 1000000
  preload_tool:
    run_image: redislabs/memtier_benchmark:edge
    tool: memtier_benchmark
    arguments: --hide-histogram -R --data-size 64 --key-minimum 1 --key-maximum 1000000
      -n 10000 --command "SET __key__ __data__" --command-key-pattern "P" --pipeline 50
      -c 50 -t 2
  resources:
    requests:
      cpus: '2'
      memory: 4g
  dataset_name: 1Mkeys-bitmap-512bits-random-regrow-roaring-on
  dataset_description: This dataset contains 1M raw-encoded 64-byte values used as
    bitmaps. Writing bit 8191 extends a value to 1KiB while rewriting it with a 64-byte
    payload returns it to its original size, so a mixed workload keeps roughly half the
    keyspace short and the allocation-growth path continuously exercised at bounded
    memory.
tested-commands:
- setbit
- set
tested-groups:
- bitmap
- string
redis-topologies:
- oss-standalone
build-variants:
- gcc:15.2.0-amd64-debian-bookworm-default
- gcc:15.2.0-arm64-debian-bookworm-default
- dockerhub
clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: --pipeline 10 -R --data-size 64 --command "SETBIT __key__ 8191 1"
    --command-key-pattern "R" --command "SET __key__ __data__" --command-key-pattern "R"
    --key-minimum 1 --key-maximum 1000000 --distinct-client-seed -c 50 -t 2
    --hide-histogram --test-time 120
  resources:
    requests:
      cpus: '2'
      memory: 2g
exporter:
  redistimeseries:
    metrics:
    - $."ALL STATS".Setbits."Ops/sec"
priority: 19
