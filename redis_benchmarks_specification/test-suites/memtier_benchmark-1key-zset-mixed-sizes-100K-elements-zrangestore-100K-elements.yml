version: 0.4
name: memtier_benchmark-1key-zset-mixed-sizes-100K-elements-zrangestore-100K-elements
description: 'Runs memtier_benchmark, for a keyspace length of 1 SORTED SET key with a
  mixed member-size distribution (24B/96B/192B/320B/1024B/4096B at 70/15/5/4/4/2%,
  matching the mix cited in upstream large-zset representation design reports,
  redis/redis#15635) and we query it using ZRANGESTORE, copying the full 100,000-element
  source into a destination key -- the write-heavy large-copy path, adapted from the
  registered 600K-to-300K ZRANGESTORE specs to a realistic mixed-size corpus instead of a
  uniform short-integer one. Measures Ops/sec. This dataset contains 1 sorted set key with 100,000 elements whose member sizes follow a realistic mixed distribution (24B 70%, 96B 15%, 192B 5%, 320B 4%, 1024B 4%, 4096B 2%) matching the size mix cited in upstream large-zset representation design reports (redis/redis#15635), which introduce external allocation for members >=320B. Members are deterministic (literal filler + embedded numeric id, not random bytes) so exact per-bucket byte sizes are reproducible; content-uniqueness relies on the embedded id, not on randomized payload bytes. Every element has a constant score (0) -- a single `__key__` occurrence per preload command (score is a literal, not a second `__key__`). Encoding: skiplist+hashtable
  (100,000 elements, exceeds zset-max-listpack-entries 128).'
dbconfig:
  configuration-parameters:
    save: '""'
  check:
    keyspacelen: 1
  preload_tool:
    run_image: redislabs/memtier_benchmark:edge
    tool: memtier_benchmark
    arguments: >
      --key-prefix ""
      --command "ZADD zsetmix 0 m24-xxxxxxxxxxxxxx__key__"
      --command-key-pattern P --command-ratio 70
      --command "ZADD zsetmix 0 m96-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx__key__"
      --command-key-pattern P --command-ratio 15
      --command "ZADD zsetmix 0 m192-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx__key__"
      --command-key-pattern P --command-ratio 5
      --command "ZADD zsetmix 0 m320-__key__"
      --command-key-pattern P --command-ratio 4
      --command "ZADD zsetmix 0 m1024-__key__"
      --command-key-pattern P --command-ratio 4
      --command "ZADD zsetmix 0 m4096-__key__"
      --command-key-pattern P --command-ratio 2
      -n allkeys -c 1 -t 1 --hide-histogram --key-minimum 100000 --key-maximum 200000 --pipeline 1
  resources:
    requests:
      memory: 1g
  dataset_name: 1key-zset-100K-elements-mixed-sizes
  dataset_description: This dataset contains 1 sorted set key with 100,000 elements whose member sizes follow a realistic mixed distribution (24B 70%, 96B 15%, 192B 5%, 320B 4%, 1024B 4%, 4096B 2%) matching the size mix cited in upstream large-zset representation design reports (redis/redis#15635), which introduce external allocation for members >=320B. Members are deterministic (literal filler + embedded numeric id, not random bytes) so exact per-bucket byte sizes are reproducible; content-uniqueness relies on the embedded id, not on randomized payload bytes. Every element has a constant score (0) -- a single `__key__` occurrence per preload command (score is a literal, not a second `__key__`).
tested-commands:
- zrangestore
redis-topologies:
- oss-standalone
build-variants:
- gcc:15.2.0-amd64-debian-bookworm-default
- gcc:15.2.0-arm64-debian-bookworm-default
- dockerhub
clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: --test-time 120 -c 1 -t 1 --command "ZRANGESTORE zsetmix1 zsetmix 0 100000"
    --command-key-pattern="P" --key-minimum=1 --key-maximum 1 --hide-histogram
  resources:
    requests:
      cpus: '4'
      memory: 4g
tested-groups:
- sorted-set
priority: 12
