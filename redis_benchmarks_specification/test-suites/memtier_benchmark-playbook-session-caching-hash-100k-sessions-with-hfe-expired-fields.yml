version: 0.4
name: memtier_benchmark-playbook-session-caching-hash-100k-sessions-with-hfe-expired-fields
description: |
  Runs memtier_benchmark to stress `HGETALL` on hashes that contain a large fraction
  of **expired hash fields** (hash-field expiration / HFE).

  Motivation:
    - Redis `HGETALL/HKEYS/HVALS` currently compute an up-front "visible" length by
      calling `hashTypeLength(... subtractExpiredFields=1)` before iterating and
      emitting fields.
    - Under HFE, this can require an extra "dry-run" pass to account for expired
      fields, and then a second full pass to actually iterate and emit the reply.
    - A deferred-length reply avoids that pre-pass and should reduce CPU work.

  Workload shape:
    - Preload 100,000 session hashes (`session:<id>`) with 50 small fields each.
    - Apply HFE (HPEXPIRE) with a very short TTL (1s) to 45/50 fields per hash.
      The remaining 5 fields have no TTL and should remain visible.
    - Benchmark issues `HGETALL` reads on random keys.

  Why random key selection:
    - Hot-key (Zipfian) access can quickly "clean" expired fields on a few keys.
      Random selection spreads reads across the keyspace, increasing the chance
      that each read pays the expired-field accounting cost.

  Notes:
    - This benchmark is intentionally designed as a detector for the deferred-length
      `genericHgetallCommand` optimization.
    - It is not intended as a realistic session caching TTL model (real systems often
      expire the entire session key rather than individual fields).

dbconfig:
  configuration-parameters:
    save: '""'
  check:
    keyspacelen: 100000
  resources:
    requests:
      memory: 2g
  preload_tool:
    run_image: redislabs/memtier_benchmark:edge
    tool: memtier_benchmark
    arguments: >
      --key-prefix ""
      --command "HSET session:__key__ field:1 v1 field:2 v2 field:3 v3 field:4 v4 field:5 v5 field:6 v6 field:7 v7 field:8 v8 field:9 v9 field:10 v10 field:11 v11 field:12 v12 field:13 v13 field:14 v14 field:15 v15 field:16 v16 field:17 v17 field:18 v18 field:19 v19 field:20 v20 field:21 v21 field:22 v22 field:23 v23 field:24 v24 field:25 v25 field:26 v26 field:27 v27 field:28 v28 field:29 v29 field:30 v30 field:31 v31 field:32 v32 field:33 v33 field:34 v34 field:35 v35 field:36 v36 field:37 v37 field:38 v38 field:39 v39 field:40 v40 field:41 v41 field:42 v42 field:43 v43 field:44 v44 field:45 v45 field:46 v46 field:47 v47 field:48 v48 field:49 v49 field:50 v50"
      --command-key-pattern="P"
      --command "HPEXPIRE session:__key__ 1000 FIELDS 45 field:1 field:2 field:3 field:4 field:5 field:6 field:7 field:8 field:9 field:10 field:11 field:12 field:13 field:14 field:15 field:16 field:17 field:18 field:19 field:20 field:21 field:22 field:23 field:24 field:25 field:26 field:27 field:28 field:29 field:30 field:31 field:32 field:33 field:34 field:35 field:36 field:37 field:38 field:39 field:40 field:41 field:42 field:43 field:44 field:45"
      --command-key-pattern="P"
      --key-minimum=1
      --key-maximum=100001
      -n 200000
      -c 1 -t 1
      --hide-histogram
      --pipeline 50

tested-groups:
- hash

tested-commands:
- hgetall
- hpexpire

redis-topologies:
- oss-standalone

build-variants:
- gcc:15.2.0-amd64-debian-bookworm-default
- gcc:15.2.0-arm64-debian-bookworm-default
- dockerhub

clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: >
    --key-prefix "session:"
    --key-minimum 1
    --key-maximum 100000
    --pipeline=1
    --print-percentiles=50,90,95,99
    --run-count=1
    --test-time=120
    --command="HGETALL __key__"
    --command-key-pattern=R
    --hide-histogram
    -c 25 -t 8
  resources:
    requests:
      cpus: '8'
      memory: 2g

priority: 150
