version: 0.4
name: memtier_benchmark-1key-zset-128-elements-listpack-zpopmin-count-10-zadd-restore
description: 'Runs memtier_benchmark against 1 SORTED SET key with 128 members. Encoding: listpack (128 members, at the zset-max-listpack-entries limit; members are 10-byte strings). ZPOPMIN with COUNT 10 pops member:000 to member:009 from the head of the listpack. Each pop is followed on the same connection by a ZADD that puts the popped members back with their scores, so the set stays at 128 members and stays a listpack for the whole run. A single connection keeps every pop and its restore adjacent; with more connections two pops could land before their restores and a member would be lost. Metric of interest: Ops/sec, which counts both commands; pops/sec is exactly half of it, so the relative change is the same.'
