version: 0.4
name: memtier_benchmark-8keys-zset-500-elements-12B-members-zintercard
description: 'Runs memtier_benchmark issuing ZINTERCARD over 8 sorted sets of 500 elements each
  whose members are exactly 12 bytes in the common prefix:id shape (user:0000001..user:0000500, a
  5-byte prefix plus a zero-padded 7-digit id). All keys hold the identical member set (100%
  overlap), so the reply is always 500. Twin of the 8-key 500-element suites with 3-5 byte and
  36-byte members: the only change in the queried keys is member length (12 bytes). Encoding:
  skiplist through 8.10.x, btree (OBJ_ENCODING_BTREE) from 8.12 (every input holds 500 elements,
  above zset-max-listpack-entries 128). Load: memtier defaults (4 threads x 50 clients, pipeline 1),
  the same as the existing ZINTER/ZINTERCARD suites so results line up with them. Unlike the
  existing 2-key and 8-key ZINTERCARD suites, which preload 64 keys, this suite preloads only the 8
  keys it queries. Metric of interest: Ops/sec.'
dbconfig:
  configuration-parameters:
    save: '""'
  check:
    keyspacelen: 8
  resources:
    requests:
      memory: 1g
  init_lua: |
    -- 8 sorted sets holding the identical 500 members user:0000001..user:0000500
    -- (exactly 12 bytes each: 'user:' plus a zero-padded 7-digit id), score = index.
    for k = 1, 8 do
      for m = 1, 500 do
        redis.call('ZADD', 'ov:' .. k, m, string.format('user:%07d', m))
      end
    end
    return 1
  dataset_name: 8keys-sorted-set-500-elements-12B-prefix-id-members
  dataset_description: 8 sorted sets ov:1..ov:8, each containing the identical 500 12-byte members
    user:0000001..user:0000500 (score = index).
tested-commands:
- zintercard
redis-topologies:
- oss-standalone
build-variants:
- gcc:15.2.0-amd64-debian-bookworm-default
- gcc:15.2.0-arm64-debian-bookworm-default
- dockerhub
clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: --command="ZINTERCARD 8 ov:1 ov:2 ov:3 ov:4 ov:5 ov:6 ov:7 ov:8 LIMIT 0"  --hide-histogram --test-time 120
  resources:
    requests:
      cpus: '4'
      memory: 2g
tested-groups:
- sorted-set
priority: 131
