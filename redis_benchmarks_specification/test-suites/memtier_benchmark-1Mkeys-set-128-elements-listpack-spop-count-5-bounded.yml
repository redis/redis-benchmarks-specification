version: 0.4
name: memtier_benchmark-1Mkeys-set-128-elements-listpack-spop-count-5-bounded
description: 'Runs memtier_benchmark against a keyspace of 1,000,000 SET keys of 128 members
  each, issuing a BOUNDED number of SPOP key 5 calls. Because the requested count (5) is a
  tiny fraction of each set, spopWithCountCommand takes its CASE 2 strategy and -- with
  listpack-encoded sets -- goes through the specialized listpack path (lpNextRandom traversal
  plus a batched lpBatchDelete), which the generic hashtable CASE 2 spec
  (memtier_benchmark-1key-set-1M-elements-hashtable-spop-count-5-bounded) never reaches. A
  single listpack key cannot sustain a bounded run (set-max-listpack-entries caps it at 128
  members, i.e. at most 25 five-member pops before draining), so the dataset spreads the same
  shape across 1,000,000 keys, mirroring how memtier_benchmark-1Mkeys-list-lpop-rpop-with-10B-values
  bounds its destructive pops. SPOP is destructive -- the client phase is capped via -n 25600
  at -c 50 -t 4 (200 clients, so 5,120,000 total pop calls x 5 members = 25,600,000 elements,
  exactly 20% of the preloaded 128,000,000), and the R key-pattern spreads pops so each key
  loses ~26 of its 128 members on average -- no set drains onto the empty-set fast-return
  path. PRELOAD: SADD __key__ __data__ with --data-size 10 draws random 10-byte non-integer
  members, forcing listpack encoding (128 entries is exactly set-max-listpack-entries, and at
  least one non-integer member rules out intset); the P pattern over -n 640000 -c 50 -t 4
  (128,000,000 requests) cycles every key exactly 128 times. Metric of interest: Ops/sec.
  SPOP on listpack sets had zero benchmark coverage before this spec.'
dbconfig:
  configuration-parameters:
    save: '""'
  check:
    keyspacelen: 1000000
  resources:
    requests:
      memory: 4g
  preload_tool:
    run_image: redislabs/memtier_benchmark:edge
    tool: memtier_benchmark
    arguments: '"--data-size" "10" --command "SADD __key__ __data__" --command-key-pattern="P"
      --key-minimum=1 --key-maximum 1000000 -n 640000 -c 50 -t 4 --hide-histogram
      --pipeline 50'
  dataset_name: 1Mkeys-set-128-members-10B
  dataset_description: This dataset contains 1 million set keys, each with 128 members of 10
    bytes (listpack-encoded, exactly set-max-listpack-entries 128).
tested-groups:
- set
tested-commands:
- spop
redis-topologies:
- oss-standalone
build-variants:
- gcc:15.2.0-amd64-debian-bookworm-default
- gcc:15.2.0-arm64-debian-bookworm-default
- dockerhub
clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: '--command "SPOP __key__ 5" --command-key-pattern="R" --key-minimum=1 --key-maximum
    1000000 -n 25600 -c 50 -t 4 --hide-histogram'
  resources:
    requests:
      cpus: '4'
      memory: 2g
priority: 73
