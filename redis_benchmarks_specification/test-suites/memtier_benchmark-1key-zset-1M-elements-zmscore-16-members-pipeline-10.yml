version: 0.4
name: memtier_benchmark-1key-zset-1M-elements-zmscore-16-members-pipeline-10
description: 'Runs memtier_benchmark against 1 sorted set of 1,000,000 elements (integer members
  1..1,000,000, 1-7 bytes, constant score 1, loaded by the memtier preload), querying ZMSCORE with
  16 independent uniformly random members per call (the 16 __key__ tokens intentionally draw 16
  ids). Every queried member exists. Same dataset and preload as
  memtier_benchmark-1key-zset-1M-elements-zmscore-16-members. Short-member twin of
  memtier_benchmark-1key-zset-1M-elements-36B-members-zmscore-16-members-pipeline-10, at the same
  load and command shape. The set is ~26 MB of used_memory on unstable (btree; ~61 MB on 8.10.x).
  Load: 4 threads x 25 clients at pipeline 10, so the server, not the client or the network round
  trip, bounds Ops/sec; the pipeline-1, single-connection zmscore-16-members suite is round-trip
  bound and is not directly comparable. Encoding: skiplist through 8.10.x, btree
  (OBJ_ENCODING_BTREE) from 8.12 (1,000,000 elements, above zset-max-listpack-entries 128). Metric
  of interest: Ops/sec.'
dbconfig:
  configuration-parameters:
    save: '""'
  check:
    keyspacelen: 1
  preload_tool:
    run_image: redislabs/memtier_benchmark:edge
    tool: memtier_benchmark
    arguments: --pipeline 50 --command="ZADD lb 1 __key__" --command-key-pattern=P
      --key-minimum 1 --key-maximum 1000000 --key-prefix "" -n 100000 --hide-histogram -t 10 -c 1
  resources:
    requests:
      memory: 1g
  dataset_name: 1key-zset-1M-elements-const-score
  dataset_description: This dataset contains 1 sorted set key with 1,000,000 elements (integer
    members 1..1,000,000, verified via live ZCARD), each with a constant score of 1.
tested-groups:
- sorted-set
tested-commands:
- zmscore
redis-topologies:
- oss-standalone
build-variants:
- gcc:15.2.0-amd64-debian-bookworm-default
- gcc:15.2.0-arm64-debian-bookworm-default
- dockerhub
clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: --command="ZMSCORE lb __key__ __key__ __key__ __key__ __key__ __key__ __key__ __key__ __key__ __key__ __key__ __key__ __key__ __key__ __key__ __key__"
    --key-minimum 1 --key-maximum 1000000 --command-key-pattern=R --key-prefix "" --hide-histogram
    --test-time 180 --pipeline 10 -c 25 -t 4
  resources:
    requests:
      cpus: '4'
      memory: 2g
priority: 73
