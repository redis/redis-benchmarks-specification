version: 0.4
name: memtier_benchmark-1Kkeys-json-test-get-recursive-descent-uid
description: |
  Measures Ops/sec for JSON.GET with recursive descent and no filter (`$..uid`) over the 153 KB
  issue-674 document: one object key lookup per visited object (4,378 objects) and 4,378 integers
  serialised, so the command is bound by the lookup path, not by filter evaluation (the with-filter
  suite). Keyspace: 1,000 keys, test:1 .. test:1000, each holding the same JSON document of 153,199
  bytes, uniform random key selection with distinct client seeds. Measured footprint on redis:8.2.11:
  830,849 bytes per key, about 831 MB, larger than the last-level cache of current server CPUs (up to
  about 100 MB per socket), so a command reads data that is not cache resident, as on a production
  keyspace; the 1-key form of this suite measured a cache-resident document. test is the 153,298-byte
  document of RedisJSON issue 674 (RedisJSON's performance.doc_674 dataset, 4,378 objects with a uid
  member). Report throughput for this loaded client population (16 connections, 8 per thread x 2
  threads, pipeline 1, 180-second measured phase, the client shape of the with-filter sibling);
  sampled response-latency percentiles describe the same load. The client shape is the one of the
  RedisJSON spec (redis-benchmark -c 16 --threads 2 -P 1); memtier replaces redis-benchmark so the rbs
  runner can drive it. Port of RedisJSON tests/benchmarks/None, whose dataset is an RDB file loaded by
  the server. The keyspace is written client-side by a init commands (one JSON.SET of the exact
  document text at the root of test:1, then COPY to test:2 .. test:1000: the document is 153,199
  bytes, too long for one memtier argument), not from an RDB file, so the suite runs against an
  endpoint where files cannot be placed; it carries no exact keyspace check, so it also runs on a
  database that holds other suites' keys. The last init command issues the measured command once
  against test:1: an error reply, for example from a server whose JSONPath dialect rejects the path or
  an endpoint that does not allow the command, aborts the suite instead of reporting a throughput
  number for error replies. The suite needs a server with RedisJSON (Redis 8 images bundle it); the
  gcc source builds do not ship the module, so only the dockerhub build variant is declared.

