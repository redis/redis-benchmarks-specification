version: 0.4
name: memtier_benchmark-140Kkeys-load-string-with-128KiB-values-randomdata-replica-only
description: |
  Replication full-sync benchmark, value-heavy shape: 140K keys with 128KiB
  random (incompressible) values (~18.4 GB dataset) — reproduces the dataset
  shape from redis/redis#15732's own reported benchmark ("Value-heavy: 1400 x
  128KB strings, 183MB, warm cache", -24.6% RDB load time), scaled up in key
  count (not value size) so the sync duration is long enough for the
  coordinator's measurement to resolve. The metric of interest is the time
  the coordinator records for "replication link is up" — this is the
  end-to-end full sync time.

  Sizing note: the coordinator's sync-time clock only starts after
  spin_docker_redis()'s unconditional 5s post-start sleep, and polls at
  100ms granularity. At the PR's own literal 183MB, the sync would very
  likely finish inside that 5s window on modern hardware, so every run
  (baseline and comparison alike) would read close to zero — swallowing
  the signal rather than measuring it. Scaling to the sibling spec's
  proven ~20GB order of magnitude (140K x 128KiB here) keeps the sync in
  the tens-of-seconds range where the 100ms-polled clock can actually
  resolve a percentage change, while preserving the per-value byte count
  and incompressibility that are the properties this dataset shape needs
  to test. That 5s sleep is also a near-constant ~5s undercount baked
  into every ReplicationFullSyncSeconds datapoint on this spec (and its
  1KiB sibling) — harmless for A/B direction, but it inflates any
  percentage delta computed from the exported value; keep that in mind
  when reading results rather than taking the percentage at face value.

  Value size is 131062 bytes, not a round 131072 (128KiB): sds's header
  (9 bytes) plus NUL terminator push a raw 131072-byte payload one byte
  past jemalloc's 131072 size class, rounding the actual allocation up
  to 163840 (160KiB) — 140K x 160KiB ~= 22.9 GB instead of the intended
  ~18.4 GB. Trimming 10 bytes off the requested value size keeps the
  allocation inside the 131072 bin; the crc64 hypothesis this spec tests
  doesn't care about the last 10 bytes per value.

  repl-diskless-load is pinned to on-empty-db (safe here since the
  replica always starts empty). Left at its default (disabled), the
  replica writes the full incoming RDB to the bind-mounted data dir and
  only then reads it back to parse — a full ~18 GB disk write plus a
  full serial re-read landing inside the exact window this spec
  measures, on top of the checksum cost the spec exists to isolate.

  Random (-R) values are deliberate: memtier's default data pattern is
  highly LZF-compressible, which shrinks the on-wire/checksummed byte
  count well below the nominal value size and lets LZF decompression
  dominate replica-side CPU instead of checksumming — exactly the effect
  that made the sibling 20Mkeys-1KiB-values-replica-only spec measure ~0%
  effect for #15732 (profiled: crc64 ~0.12% of replica CPU there,
  lzf_decompress 62%). rdbcompression is pinned off (values are
  incompressible; attempting LZF on them still costs primary-side CPU for
  zero bytes saved, which would recontaminate the exact window this spec
  measures). Large, incompressible values are the one shape where a
  faster crc64() can actually show up end-to-end: enough raw bytes per
  value that checksum cost is no longer negligible (Amdahl), and no
  compression or disk I/O competing for the same CPU/wall-clock budget.

  Steady-state benchmark is intentionally short (30s) — the point of this
  test is the SYNC time during topology setup, not the steady-state ops/sec.
dbconfig:
  # Run preload BEFORE replicas spin up so the master->replica full sync
  # transfers the whole dataset (rather than syncing an empty primary and
  # propagating writes via the replication stream).
  preload_before_replica: true
  configuration-parameters:
    save: '""'
    maxmemory-policy: noeviction
    rdbcompression: 'no'
    repl-diskless-load: on-empty-db
  check:
    keyspacelen: 140000
  preload_tool:
    run_image: redislabs/memtier_benchmark:edge
    tool: memtier_benchmark
    arguments: --data-size 131062 -R --ratio 1:0 -n allkeys --pipeline 50 --key-maximum
      140000 --key-pattern P:P --key-minimum 1 --hide-histogram -t 8 -c 25
  resources:
    requests:
      memory: 23g
  dataset_name: 140Kkeys-string-128KiB-size-randomdata
  dataset_description: |
    140,000 string keys, each with a 131062-byte (~128KiB) random incompressible
    value (~18.4 GB dataset, sized to stay inside jemalloc's 131072-byte size
    class after sds header/NUL overhead) — same per-value shape as
    redis/redis#15732's own "value-heavy" benchmark cell, scaled up in key
    count so the full-sync duration is long enough for the coordinator's
    100ms-polled clock to resolve a percentage-level change.
tested-commands:
- set
redis-topologies:
- oss-standalone-01-replicas
build-variants:
- gcc:15.2.0-amd64-debian-bookworm-default
- gcc:15.2.0-arm64-debian-bookworm-default
- dockerhub
clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: '"--data-size" "131062" --pipeline 10 --distinct-client-seed --ratio
    0:1 --key-pattern R:R --key-minimum=1 --key-maximum 140000 --test-time 30 -c
    20 -t 4 --hide-histogram'
  resources:
    requests:
      cpus: '4'
      memory: 1g
tested-groups:
- string
exporter:
  redistimeseries:
    metrics:
    - $."ALL STATS".Totals.ReplicationFullSyncSeconds
    - $."ALL STATS".Totals.ReplicationFullSyncCountDuringBench
priority: 17
