version: 0.4
name: memtier_benchmark-1key-zset-128-elements-listpack-zlexcount-20-elements
description: 'Runs memtier_benchmark against 1 SORTED SET key with 128 members, all with score 0, so lex ranges apply. Encoding: listpack (128 members, at the zset-max-listpack-entries limit; members are 10-byte strings). ZLEXCOUNT over 20 members near the tail ([member:100 [member:119). Finding the start of the range checks the min bound on the 100 members before it, then the count loop checks the max bound on the 20 in range. Metric of interest: Ops/sec. The command is read-only, so the set never changes during the run.'
