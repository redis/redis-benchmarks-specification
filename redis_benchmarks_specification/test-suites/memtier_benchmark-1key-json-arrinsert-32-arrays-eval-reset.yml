version: 0.4
name: memtier_benchmark-1key-json-arrinsert-32-arrays-eval-reset
description: |
  Measures Ops/sec for JSON.ARRINSERT of one integer at index 0 of every array matched by `$..y` (32
  arrays of 16 integers, one per nested object): recursive descent over 32 objects and 32 inserts with
  an element shift, after an in-script reset of the 1.6 KB document.
  Report throughput for this loaded client population (16 connections, 8 per thread x 2 threads,
  pipeline 1, 120-second measured phase); sampled response-latency percentiles describe the same load.
  The client shape is the one of the RedisJSON spec (redis-benchmark -c 16 --threads 2 -P 1); memtier
  replaces redis-benchmark so the rbs runner can drive it.
  Port of RedisJSON tests/benchmarks/json_arrinsert_multi_existing.yml. Each request is one EVAL that
  first resets the key with JSON.SET of the whole document and then runs the insert, so state never
  grows; throughput includes the Lua call overhead and the reset parse. The suite needs EVAL
  (scripting) on the endpoint; JSON.ARRINSERT runs from the script. The init commands write the
  document once and issue the measured EVAL once: an error reply aborts the suite. The RedisJSON spec
  pins json-auto-create-deep-paths to no, the module default; the suite cannot set module
  configuration and relies on that default.
  The suite needs a server with RedisJSON (Redis 8 images bundle it); the gcc source builds do not
  ship the module, so only the dockerhub build variant is declared.

