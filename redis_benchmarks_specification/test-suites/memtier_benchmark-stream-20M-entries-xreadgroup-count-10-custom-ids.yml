version: 0.4
name: memtier_benchmark-stream-20M-entries-xreadgroup-count-10-custom-ids
description: "Sparse-ID, small-batch variant of memtier_benchmark-stream-10M-entries-xreadgroup-count-100-custom-ids. Metric of interest: Ops/sec (XREADGROUP calls per second). Data: one stream (a rax of listpack nodes) with 20M entries and custom IDs 'N-0' (1-0, 2-0, ..., 20000000-0), so there is one ID per millisecond and no two entries share a millisecond. Compared with auto-generated IDs that share millisecond prefixes, these IDs change radix-prefix sharing during consumer-group and consumer PEL insertion. COUNT 10 measures small batches; Ops/sec includes stream lookup, PEL updates and replies. Fixed work: 25 clients x 4 threads x 5000 = 500K calls, about 5M entries delivered (one quarter of the stream), so the reader never runs dry. The fixed-work run can be short, so record its actual duration and decide on 3 or more separate triggers."
dbconfig:
  configuration-parameters:
    save: '""'
  check:
    keyspacelen: 1
  preload_tool:
    run_image: redislabs/memtier_benchmark:edge
    tool: memtier_benchmark
    arguments: '"--data-size" "100" --command "XADD stream-key __key__-0 field __data__" --command-key-pattern="P" --key-minimum=1 --key-maximum=20000000 --key-prefix="" -n 20000000 -c 1 -t 1 --pipeline 100 --hide-histogram'
  init_commands:
    - XGROUP CREATE stream-key test-group 0 MKSTREAM
  resources:
    requests:
      memory: 6g
  dataset_name: 20M-stream-entries-custom-ids-with-consumer-group
  dataset_description: This dataset contains 1 stream key with 20M entries inserted using monotonic custom IDs 'N-0' (one ID per millisecond, no shared sequence), and a consumer group named 'test-group'.
tested-commands:
  - xreadgroup
redis-topologies:
  - oss-standalone
build-variants:
  - gcc:15.2.0-amd64-debian-bookworm-default
  - gcc:15.2.0-arm64-debian-bookworm-default
  - dockerhub
clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: --command="XREADGROUP GROUP test-group consumer1 COUNT 10 STREAMS stream-key >" --hide-histogram -n 5000 -c 25 -t 4
  resources:
    requests:
      cpus: "4"
      memory: 2g
tested-groups:
  - stream
priority: 150
