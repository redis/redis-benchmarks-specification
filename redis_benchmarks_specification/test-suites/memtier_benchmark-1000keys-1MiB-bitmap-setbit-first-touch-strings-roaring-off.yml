version: 0.4
name: memtier_benchmark-1000keys-1MiB-bitmap-setbit-first-touch-strings-roaring-off
description: 'Measures the cost of the first write to a string bitmap. 1000 keys of 1MiB random bytes (about 50%
  set bits) are preloaded as plain strings with SET while bitmap-default-roaring is no. The measured run issues
  exactly one ''SETBIT key 7 1'' per key on a single connection with no pipelining, so every request is a first
  touch and latency is per command. This spec keeps bitmap-default-roaring at no, so SETBIT stays on the plain string
  path and is the baseline for the conversion variant. Compare it with its sibling strings-convert-on-first-write
  spec: the difference in throughput and in p50/p99 latency is the conversion cost. The SETBIT offset (7) is inside
  the first byte, so the logical write is the same size for every string size and the difference between sizes is
  the conversion. Needs a build with native compressed bitmaps.'
dbconfig:
  configuration-parameters:
    save: '""'
    bitmap-default-roaring: 'no'
  check:
    keyspacelen: 1000
  dataset_name: 1000keys-1MiB-bitmap-random-strings-first-touch
  dataset_description: 1000 keys holding 1MiB of random bytes each, loaded as plain strings, one SETBIT per key
    in the measured run.
  preload_tool:
    run_image: redislabs/memtier_benchmark:edge
    tool: memtier_benchmark
    arguments: --hide-histogram -R --data-size 1048576 --key-minimum 1 --key-maximum 1000 -c 10 -t 1 --pipeline
      1 -n 100 --command "SET __key__ __data__" --command-key-pattern "P"
  resources:
    requests:
      cpus: '2'
      memory: 4g
tested-commands:
- setbit
tested-groups:
- bitmap
redis-topologies:
- oss-standalone
build-variants:
- gcc:15.2.0-amd64-debian-bookworm-default
- gcc:15.2.0-arm64-debian-bookworm-default
clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: --hide-histogram --pipeline 1 -c 1 -t 1 --key-minimum 1 --key-maximum 1000 -n 1000 --command "SETBIT
    __key__ 7 1" --command-key-pattern "P"
  resources:
    requests:
      cpus: '2'
      memory: 2g
exporter:
  redistimeseries:
    metrics:
    - $."ALL STATS".Setbits."Ops/sec"
priority: 20
