version: 0.4
name: memtier_benchmark-1key-1Billion-bits-bitmap-bitcount
description: Runs memtier_benchmark, for a keyspace length of 1 keys focusing on BITCOUNT
  performance. The bitmap has a size of 1 Billion bits and approximately 20M bits
  are set. The size of it is ~140MB. BITCOUNT start/end are byte offsets, so the client
  draws its start offset uniformly from 1..125000000, the bitmap length in bytes, and
  every call counts from that offset to the end of the bitmap, scanning ~62.5MB on
  average. This spec previously drew that offset from 1..1000000000, a bit count, so
  87.5% of calls returned 0 without scanning anything; correcting the ceiling raises
  reported per-call cost ~7.9x, which is the step visible in the stored time series.
  At memtier's default concurrency (200 connections) the client-side latency percentiles
  are queueing-dominated, so read this suite on server-side usec_per_call rather than on
  reported latency.
dbconfig:
  configuration-parameters:
    save: '""'
  check:
    keyspacelen: 1
  init_commands:
  - '"SETBIT" "users" "1000000000" "1"'
  preload_tool:
    run_image: redislabs/memtier_benchmark:edge
    tool: memtier_benchmark
    arguments: --hide-histogram --command "SETBIT users __key__ 1" --key-maximum 1000000000
      --key-minimum 1 -n 100000 --key-prefix "" --command-key-pattern R --distinct-client-seed
      --pipeline 50
  resources:
    requests:
      cpus: '2'
      memory: 1g
  dataset_name: 1key-bitmap-1Billion-bits-140MB-size
  dataset_description: This dataset contains 1 bitmap key with a size of 1 Billion
    bits, approximately 20M bits are set and the total size is around 140MB.
tested-commands:
- bitcount
tested-groups:
- bitmap
redis-topologies:
- oss-standalone
build-variants:
- gcc:15.2.0-amd64-debian-bookworm-default
- gcc:15.2.0-arm64-debian-bookworm-default
- dockerhub
clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: --command "BITCOUNT users __key__ -1" --key-maximum 125000000 --key-minimum
    1 --key-prefix "" --command-key-pattern R --distinct-client-seed --test-time 120
  resources:
    requests:
      cpus: '2'
      memory: 2g
priority: 19
