version: 0.4
name: memtier_benchmark-2keys-zset-128-listpack-500-elements-zintercard
description: 'Runs memtier_benchmark issuing ZINTERCARD over 2 sorted sets with different encodings:
  ''lp'' holds 128 members m:1..m:128 (exactly zset-max-listpack-entries, so listpack) and ''bt'' holds
  500 members m:1..m:500. lp is the smaller input, so the server iterates the listpack and looks
  each member up in bt; overlap is 100% of lp (3-5 byte members) and the reply is always the integer
  128. A coverage point for intersection across mixed encodings, not a one-axis delta against
  another suite. Each call does only 128 small lookups, so per-request overhead is a large share of
  each call and small changes in the intersect path are diluted. Encoding: lp = listpack; bt =
  skiplist through 8.10.x, btree (OBJ_ENCODING_BTREE) from 8.12. Load: memtier defaults (4 threads x
  50 clients, pipeline 1), the same as the existing ZINTER/ZINTERCARD suites so results line up with
  them. Unlike the existing 2-key and 8-key ZINTERCARD suites, which preload 64 keys, this suite
  preloads only the 2 keys it queries. Metric of interest: Ops/sec.'
dbconfig:
  configuration-parameters:
    save: '""'
  check:
    keyspacelen: 2
  resources:
    requests:
      memory: 1g
  init_lua: |
    -- lp: 128 members m:1..m:128 (at zset-max-listpack-entries, so listpack).
    -- bt: 500 members m:1..m:500. lp is the smaller input, so it is iterated and
    -- every member is looked up in bt; intersection = 128.
    for m = 1, 128 do
      redis.call('ZADD', 'lp', m, 'm:' .. m)
    end
    for m = 1, 500 do
      redis.call('ZADD', 'bt', m, 'm:' .. m)
    end
    return 1
  dataset_name: 2keys-zset-128-listpack-500
  dataset_description: lp = listpack zset m:1..m:128; bt = zset m:1..m:500 (500 elements, above
    zset-max-listpack-entries). Intersection = 128.
tested-commands:
- zintercard
redis-topologies:
- oss-standalone
build-variants:
- gcc:15.2.0-amd64-debian-bookworm-default
- gcc:15.2.0-arm64-debian-bookworm-default
- dockerhub
clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: --command="ZINTERCARD 2 lp bt LIMIT 0"  --hide-histogram --test-time 120
  resources:
    requests:
      cpus: '4'
      memory: 2g
tested-groups:
- sorted-set
priority: 131
