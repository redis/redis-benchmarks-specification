version: 0.4
name: memtier_benchmark-1key-json-path-sonde-foo-arrappend-geojson-feature
description: |
  Measures Ops/sec for JSON.ARRAPPEND of a 260-byte GeoJSON feature (an object with nested objects and
  an array of floats) onto `$.properties.coordinateProperties`: parse of the value and an append to
  one array. As in the RedisJSON spec the array grows for the whole run, so the run is bounded by a
  request count (1,000,000 requests, about 300 MB of appended values at the end) instead of a measured
  time; --override-memtier-test-time does not shorten it.
  path:sonde:foo is the 387-byte GeoJSON feature of RedisJSON's gh295 dataset (a
  properties.coordinateProperties array of GeoJSON features).
  Report throughput for this loaded client population (16 connections, 8 per thread x 2 threads,
  pipeline 1, 1,000,000 requests); sampled response-latency percentiles describe the same load. The
  client shape is the one of the RedisJSON spec (redis-benchmark -c 16 --threads 2 -P 1); memtier
  replaces redis-benchmark so the rbs runner can drive it.
  Port of RedisJSON tests/benchmarks/json_arrappend_geojson.yml, whose dataset is an RDB file loaded
  by the server. The document is loaded client-side by an init command (JSON.SET of the exact document
  text at the root, so a rerun restores it), not from an RDB file, so the suite runs against an
  endpoint where files cannot be placed; it carries no exact keyspace check, so it also runs on a
  database that holds other suites' keys. The last init command issues the measured command once: an
  error reply, for example from a server whose JSONPath dialect rejects the path or an endpoint that
  does not allow the command, aborts the suite instead of reporting a throughput number for error
  replies.
  The suite needs a server with RedisJSON (Redis 8 images bundle it); the gcc source builds do not
  ship the module, so only the dockerhub build variant is declared.

dbconfig:
  configuration-parameters:
    save: '""'
  resources:
    requests:
      memory: 1g
  init_commands:
    - ['JSON.SET', 'path:sonde:foo', '$', '{"type":"Feature","geometry":{"type":"LineString","coordinates":[[47,15,920]]},"properties":{"coordinateProperties":[{"type":"Feature","geometry":{"type":"Point","coordinates":[26.2153,60.34085,417.0]},"properties":{"temp":3.6,"serial":"S0730589","humidity":64.6,"vel_h":16.0,"uploader_callsign":"Lahti 24h raspberry","time":1617220020,"uploader":{"callsign":"Lahti 24h raspberry"}}}]}}']
    - ['JSON.ARRAPPEND', 'path:sonde:foo', '$.properties.coordinateProperties', '{"type": "Feature", "geometry": {"type": "Point", "coordinates": [26.2153, 60.34085, 417.0]}, "properties": {"temp": 3.6, "serial": "S0730589", "humidity": 64.6, "vel_h": 16.0, "uploader_callsign": "Lahti 24h raspberry", "time": 1617220020, "uploader": {"callsign": "Lahti 24h raspberry"}}}']

tested-groups:
- json

tested-commands:
- json.arrappend

redis-topologies:
- oss-standalone

build-variants:
- dockerhub

clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: >
    -c 8 -t 2
    --distinct-client-seed
    --pipeline=1
    --print-percentiles=50,90,95,99
    --run-count=1
    --requests=62500
    --command="JSON.ARRAPPEND path:sonde:foo $.properties.coordinateProperties \"{\\\"type\\\": \\\"Feature\\\", \\\"geometry\\\": {\\\"type\\\": \\\"Point\\\", \\\"coordinates\\\": [26.2153, 60.34085, 417.0]}, \\\"properties\\\": {\\\"temp\\\": 3.6, \\\"serial\\\": \\\"S0730589\\\", \\\"humidity\\\": 64.6, \\\"vel_h\\\": 16.0, \\\"uploader_callsign\\\": \\\"Lahti 24h raspberry\\\", \\\"time\\\": 1617220020, \\\"uploader\\\": {\\\"callsign\\\": \\\"Lahti 24h raspberry\\\"}}}\""
    --command-key-pattern=R
    --hide-histogram
  resources:
    requests:
      cpus: '4'
      memory: 2g

priority: 150
