version: 0.4
name: memtier_benchmark-50Kkeys-json-10items-set-fulldoc-pipeline-10
description: |
  Measures Ops/sec for JSON.SET of a whole 2875-byte document at the root path `$` of a random
  existing key, pipeline 10: the module parses the document text into its JSON data structure (173
  strings, numbers and booleans in 40 objects and 11 arrays) and replaces the stored root, dropping
  the previous document. Measured footprint on redis:8.2.11: 7,822 bytes per key, about 391 MB, larger
  than the last-level cache of current server CPUs (up to about 100 MB per socket), so a command reads
  data that is not cache resident; the 1000-key form of this suite fit in the last-level cache of
  large server parts. Document size stays constant. The pipeline shrinks the per-request networking
  share so parsing and allocation dominate each request; this is the write counterpart of the
  pipelined nested-path GET suite. Every document is an object with an `items` array of 10 objects;
  each item has 8 scalar fields, a nested `attrs` object with 6 fields, a `tags` array of 3 strings
  and two empty placeholder objects, `extra` and `merged`. `extra` exists because the wildcard
  JSON.SET suite replaces it and RedisJSON creates new children only through static paths; `merged` is
  pre-created so every JSON.MERGE does the same work from the first command. 2875 bytes per document,
  50,000 documents, keys doc:1 .. doc:50000, uniform random key selection with distinct client seeds.
  Report throughput for this loaded client population (100 connections, 25 per thread x 4 threads,
  pipeline 10, 120-second measured phase); sampled response-latency percentiles describe the same
  load. Sizes come from the literal JSON payloads. After the preload an init command issues the
  measured command shape once against doc:1 (a no-op for the write suites); an error reply, for
  example from a server whose JSONPath dialect rejects the path, aborts the suite instead of reporting
  a throughput number for error replies. The suite needs a server with RedisJSON (Redis 8 images
  bundle it); the gcc source builds do not ship the module, so only the dockerhub build variant is
  declared. The first init command checks that the last preloaded key (doc:50000) exists, an error
  reply if the preload did not complete; there is no exact keyspace check, so the suite also runs on
  an endpoint database that holds other suites' keys (no FLUSHALL needed between suites).

