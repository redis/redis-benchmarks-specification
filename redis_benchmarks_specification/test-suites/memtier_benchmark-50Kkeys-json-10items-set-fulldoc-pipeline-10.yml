\\\"vendor\\\":\\\"vendor-2\\\",\\\"rating\\\":4.3,\\\"attrs\\\":{\\\"color\\\":\\\"blue\\\",\\\"size\\\":\\\"S\\\",\\\"weight\\\":2.5,\\\"material\\\":\\\"cotton\\\",\\\"origin\\\":\\\"PT\\\",\\\"warranty\\\":\\\"2y\\\"},\\\"tags\\\":[\\\"new\\\",\\\"sale\\\",\\\"featured\\\"],\\\"extra\\\":{},\\\"merged\\\":{}},{\\\"id\\\":\\\"item-09\\\",\\\"name\\\":\\\"Item number 9\\\",\\\"qty\\\":10,\\\"price\\\":23.49,\\\"active\\\":false,\\\"sku\\\":\\\"SKU00009\\\",\\\"vendor\\\":\\\"vendor-0\\\",\\\"rating\\\":4.4,\\\"attrs\\\":{\\\"color\\\":\\\"red\\\",\\\"size\\\":\\\"M\\\",\\\"weight\\\":2.75,\\\"material\\\":\\\"cotton\\\",\\\"origin\\\":\\\"PT\\\",\\\"warranty\\\":\\\"2y\\\"},\\\"tags\\\":[\\\"new\\\",\\\"sale\\\",\\\"featured\\\"],\\\"extra\\\":{},\\\"merged\\\":{}}]}\""
      --command-key-pattern="P" --key-minimum=1 --key-maximum=50001 -n allkeys
      -c 1 -t 1 --hide-histogram --pipeline 50'
