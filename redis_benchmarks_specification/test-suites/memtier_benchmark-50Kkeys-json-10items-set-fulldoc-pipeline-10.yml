    - ["JSON.SET", "doc:1", "$", "{\"id\":\"doc\",\"version\":2,\"owner\":\"benchmark\",\"items\":[{\"id\":\"item-00\",\"name\":\"Item number 0\",\"qty\":1,\"price\":9.99,\"active\":true,\"sku\":\"SKU00000\",\"vendor\":\"vendor-0\",\"rating\":3.5,\"attrs\":{\"color\":\"red\",\"size\":\"S\",\"weight\":0.5,\"material\":\"cotton\",\"origin\":\"PT\",\"warranty\":\"2y\"},\"tags\":[\"new\",\"sale\",\"featured\"],\"extra\":{},\"merged\":{}},{\"id\":\"item-01\",\"name\":\"Item number 1\",\"qty\":2,\"price\":11.49,\"active\":false,\"sku\":\"SKU00001\",\"vendor\":\"vendor-1\",\"rating\":3.6,\"attrs\":{\"color\":\"green\",\"size\":\"M\",\"weight\":0.75,\"material\":\"cotton\",\"origin\":\"PT\",\"warranty\":\"2y\"},\"tags\":[\"new\",\"sale\",\"featured\"],\"extra\":{},\"merged\":{}},{\"id\":\"item-02\",\"name\":\"Item number 2\",\"qty\":3,\"price\":12.99,\"active\":true,\"sku\":\"SKU00002\",\"vendor\":\"vendor-2\",\"rating\":3.7,\"attrs\":{\"color\":\"blue\",\"size\":\"L\",\"weight\":1.0,\"material\":\"cotton\",\"origin\":\"PT\",\"warranty\":\"2y\"},\"tags\":[\"new\",\"sale\",\"featured\"],\"extra\":{},\"merged\":{}},{\"id\":\"item-03\",\"name\":\"Item number 3\",\"qty\":4,\"price\":14.49,\"active\":false,\"sku\":\"SKU00003\",\"vendor\":\"vendor-0\",\"rating\":3.8,\"attrs\":{\"color\":\"red\",\"size\":\"XL\",\"weight\":1.25,\"material\":\"cotton\",\"origin\":\"PT\",\"warranty\":\"2y\"},\"tags\":[\"new\",\"sale\",\"featured\"],\"extra\":{},\"merged\":{}},{\"id\":\"item-04\",\"name\":\"Item number 4\",\"qty\":5,\"price\":15.99,\"active\":true,\"sku\":\"SKU00004\",\"vendor\":\"vendor-1\",\"rating\":3.9,\"attrs\":{\"color\":\"green\",\"size\":\"S\",\"weight\":1.5,\"material\":\"cotton\",\"origin\":\"PT\",\"warranty\":\"2y\"},\"tags\":[\"new\",\"sale\",\"featured\"],\"extra\":{},\"merged\":{}},{\"id\":\"item-05\",\"name\":\"Item number 5\",\"qty\":6,\"price\":17.49,\"active\":false,\"sku\":\"SKU00005\",\"vendor\":\"vendor-2\",\"rating\":4.0,\"attrs\":{\"color\":\"blue\",\"size\":\"M