version: 0.4
name: memtier_benchmark-10keys-bitmap-50B-bitop-xor-pipeline-10-50_conns-strings-roaring-on
description: >
  String-data variant of memtier_benchmark-10keys-bitmap-50B-bitop-xor-pipeline-10-50_conns,
  run with bitmap-default-roaring yes. The preload is unchanged, so the keys start as plain
  strings, as they would on a dataset created before the config was enabled; BITOP XOR takes
  the native path even though every source is a plain string, and stores a Roaring result.
  Same keyspace and client arguments as the string spec, which runs with the config off.
dbconfig:
  configuration-parameters:
    save: '""'
    bitmap-default-roaring: 'yes'
  check:
    keyspacelen: 10
  preload_tool:
    run_image: redislabs/memtier_benchmark:edge
    tool: memtier_benchmark
    arguments: >
      --command "SET __key__ __data__"
      --command-key-pattern P
      --data-size 50
      --key-prefix "key:"
      --key-minimum 1
      --key-maximum 10
      -n 10
      -c 1
      -t 1
      --hide-histogram
  resources:
    requests:
      memory: 1g
  dataset_name: 10keys-bitmap-50B-strings-roaring-on
  dataset_description: 10 string keys (key:1..key:10), each holding a 50-byte RAW value
    (32-byte AVX2 block + 18-byte scalar tail).
tested-commands:
- bitop
tested-groups:
- bitmap
redis-topologies:
- oss-standalone
build-variants:
- gcc:15.2.0-amd64-debian-bookworm-default
- gcc:15.2.0-arm64-debian-bookworm-default
- dockerhub
clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: >
    --command "BITOP XOR tmp key:1 key:2 key:3 key:4 key:5 key:6 key:7 key:8 key:9 key:10"
    --command-key-pattern R
    --hide-histogram
    --test-time 180
    --pipeline 10
    -c 5
    -t 10
  resources:
    requests:
      cpus: '10'
      memory: 2g
priority: 67
