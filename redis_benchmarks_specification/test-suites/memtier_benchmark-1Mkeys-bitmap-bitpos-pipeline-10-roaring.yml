version: 0.4
name: memtier_benchmark-1Mkeys-bitmap-bitpos-pipeline-10-roaring
description: >
  Roaring variant of memtier_benchmark-1Mkeys-bitmap-bitpos-pipeline-10. The server runs with
  bitmap-default-roaring yes, so the preload creates Roaring bitmaps (OBJECT ENCODING
  bitmap-roaring) instead of plain strings, and the measured command runs against them.
  Keyspace and client arguments match the string spec, so the two are directly comparable.
  Needs a build with native compressed bitmaps.
dbconfig:
  configuration-parameters:
    save: '""'
    bitmap-default-roaring: 'yes'
  check:
    keyspacelen: 1000000
  preload_tool:
    run_image: redislabs/memtier_benchmark:edge
    tool: memtier_benchmark
    arguments: --hide-histogram --key-minimum 1 --key-maximum 1000000 -n 100000
      --command "SETBIT __key__ 511 0" --command-key-pattern "P" --command "SETBIT __key__ 7 1"
      --command-key-pattern "P" --pipeline 50 -c 50 -t 2
  resources:
    requests:
      cpus: '2'
      memory: 1g
  dataset_name: 1Mkeys-bitmap-512bits-bitpos-target7-roaring
  dataset_description: Same keyspace as 1Mkeys-bitmap-512bits-bitpos-target7, created with bitmap-default-roaring yes so every key is a Roaring bitmap.
tested-commands:
- bitpos
tested-groups:
- bitmap
redis-topologies:
- oss-standalone
build-variants:
- gcc:15.2.0-amd64-debian-bookworm-default
- gcc:15.2.0-arm64-debian-bookworm-default
- dockerhub
clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: --pipeline 10 --command "BITPOS __key__ 1" --command-key-pattern "R"
    --command "BITPOS __key__ 0" --command-key-pattern "R" --key-minimum 1 --key-maximum
    1000000 -c 50 -t 2 --hide-histogram --test-time 120
  resources:
    requests:
      cpus: '2'
      memory: 2g
priority: 19
