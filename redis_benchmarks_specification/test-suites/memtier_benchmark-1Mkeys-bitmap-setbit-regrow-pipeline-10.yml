version: 0.4
name: memtier_benchmark-1Mkeys-bitmap-setbit-regrow-pipeline-10
description: Runs memtier_benchmark, for a keyspace length of 1M bitmap keys holding
  the SETBIT allocation-growth path hot in a genuine steady state. A bitmap only ever
  grows, so a fixed-offset write workload extends each key once and then degenerates
  to an in-place write forever; sustaining growth instead requires the values to be
  cut back down, and the bytes reclaimed, at the same rate they are grown. This spec
  does that with a 1:1 mix of "SETBIT key 8191 1", which extends a value from 64 bytes
  to 1KiB via sdsgrowzero() (reallocate plus a ~960-byte zero-fill, then
  keyModified/notifyKeyspaceEvent/server.dirty and the keysizes histogram update), and
  "SET key <64B>", which returns the key to a 64-byte value and frees the grown
  allocation. Both values are raw-encoded - 64 bytes is above the 44-byte embstr
  threshold - so SETBIT is never additionally charged for an embstr-to-raw conversion
  in dbUnshareStringValue(). Because each key's length is decided by whichever command
  touched it last, half the keyspace is short at any instant, which was measured as a
  stationary P(short) of 0.477 / 0.447 / 0.502 over three consecutive rounds; a SETBIT
  therefore grows whenever it lands on a short key and roughly 24% of all operations
  take the grow path indefinitely, with resident memory measured flat across rounds
  rather than climbing. The trade-off against the fixed-work 30Mkeys grow spec is
  deliberate - this one runs a full 120s at a fraction of the footprint and never
  decays, but attribution is shared with SET and the grow fraction is ~24% rather than
  100%, so read the two together. Metric of interest is Ops/sec at pipeline 10.
dbconfig:
  configuration-parameters:
    save: '""'
  check:
    keyspacelen: 1000000
  preload_tool:
    run_image: redislabs/memtier_benchmark:edge
    tool: memtier_benchmark
    arguments: --hide-histogram -R --data-size 64 --key-minimum 1 --key-maximum 1000000
      -n 10000 --command "SET __key__ __data__" --command-key-pattern "P" --pipeline 50
      -c 50 -t 2
  resources:
    requests:
      cpus: '2'
      memory: 4g
  dataset_name: 1Mkeys-bitmap-64B-regrow
  dataset_description: This dataset contains 1M raw-encoded 64-byte values used as
    bitmaps. Writing bit 8191 extends a value to 1KiB while rewriting it with a 64-byte
    payload returns it to its original size, so a mixed workload keeps roughly half the
    keyspace short and the allocation-growth path continuously exercised at bounded
    memory.
tested-commands:
- setbit
- set
tested-groups:
- bitmap
- string
redis-topologies:
- oss-standalone
build-variants:
- gcc:15.2.0-amd64-debian-bookworm-default
- gcc:15.2.0-arm64-debian-bookworm-default
- dockerhub
clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: --pipeline 10 -R --data-size 64 --command "SETBIT __key__ 8191 1"
    --command-key-pattern "R" --command "SET __key__ __data__" --command-key-pattern "R"
    --key-minimum 1 --key-maximum 1000000 --distinct-client-seed -c 50 -t 2
    --hide-histogram --test-time 120
  resources:
    requests:
      cpus: '2'
      memory: 2g
priority: 19
