version: 0.4
name: memtier_benchmark-1Mkeys-bitmap-setbit-regrow-pipeline-10
description: >-
  Runs memtier_benchmark against 1M bitmap keys to hold the SETBIT allocation-growth path
  hot in a genuine steady state. A bitmap only ever grows, so a fixed-offset write workload
  extends each key once and then degenerates to the unchanged fast path - not to an in-place
  write, but to no write at all, since sdsgrowzero() early-returns and the bit already holds
  the requested value. Sustaining growth therefore requires the values to be cut back down
  and the bytes reclaimed as fast as they are grown. Metric of interest is Ops/sec.

  The workload is a 1:1 mix of "SETBIT key 8191 1", which extends a value from 64 bytes to
  1KiB via sdsgrowzero() (reallocate, then zero the 960-byte tail in a 961-byte memset that
  includes the terminator, then keyModified(), server.dirty and the keysizes histogram), and
  "SET key <64B>", which returns the key to a 64-byte value and frees the grown allocation.
  Both values are raw-encoded - 64 bytes is above the 44-byte embstr threshold - so SETBIT
  is never additionally charged for an embstr-to-raw conversion in dbUnshareStringValue().

  Measured stationary composition: 50.0% SET, 25.0% SETBIT that grows, and 25.0% SETBIT that
  finds an already-long value and so takes the unchanged fast path (lookup and reply, nothing
  else). Half the keyspace is short at any instant - P(short) measured 0.50 over 20,000
  sampled ids - because each key's length is decided by whichever command touched it last.
  The preload leaves every key short, so the grow fraction starts near 50% and converges to
  its stationary 25% after roughly 3.5 operations per key (about 4s at 1M ops/s, about 12s of
  a 120s run at 300k ops/s); resident memory is flat only once stationary, climbing from
  ~0.13GB to ~1.3GB during that transient. The residual rate-dependence is conservative
  rather than misleading: a slower build spends more of its fixed 120s in the higher-work
  transient, which amplifies a grow-path regression rather than masking it.

  On reading the numbers. This spec declares an exporter on the per-command-type Setbits
  series so the recorded series is named for the command under test rather than for the mix;
  it does not buy independent sensitivity, because with the streams locked 1:1 on shared
  connections Setbits.Ops/sec is exactly half of Totals.Ops/sec. Automation must be pointed
  at it explicitly - compare, self-heal and git-sanity all default to
  ALL_STATS.Totals.Ops/sec, so use --metric_name "ALL_STATS.Setbits.Ops/sec". Even then the
  grow path is only half of that series, so a 10% grow-path change moves Setbits about 5% and
  the default Totals about 2.5%; the 4Mkeys grow spec is the 100%-attributed instrument and
  these two should be read together. The p50/p99 that defaults.yml exports for this spec are
  Totals percentiles at pipeline 10 across 100 connections, so they are queueing latencies over
  a 1:1 SETBIT/SET mix rather than SETBIT command cost.

  Two caveats on allocation. sdsgrowzero() grows greedily, so a 1KiB target allocates 2048
  bytes plus header (a 2560-byte size class) and the steady-state footprint is ~1.3GB at 1M
  keys rather than the ~0.55GB a literal reading of "1KiB values" suggests. And the value
  crosses SDS_TYPE_8 to SDS_TYPE_16, so _sdsMakeRoomFor() takes its malloc/memcpy/free path
  and never its in-place s_realloc_usable() branch.
dbconfig:
  configuration-parameters:
    save: '""'
  check:
    keyspacelen: 1000000
  preload_tool:
    run_image: redislabs/memtier_benchmark:edge
    tool: memtier_benchmark
    arguments: --hide-histogram -R --data-size 64 --key-minimum 1 --key-maximum 1000000
      -n 10000 --command "SET __key__ __data__" --command-key-pattern "P" --pipeline 50
      -c 50 -t 2
  resources:
    requests:
      cpus: '2'
      memory: 4g
  dataset_name: 1Mkeys-bitmap-512bits-random-regrow
  dataset_description: This dataset contains 1M raw-encoded 64-byte values used as
    bitmaps. Writing bit 8191 extends a value to 1KiB while rewriting it with a 64-byte
    payload returns it to its original size, so a mixed workload keeps roughly half the
    keyspace short and the allocation-growth path continuously exercised at bounded
    memory.
tested-commands:
- setbit
- set
tested-groups:
- bitmap
- string
redis-topologies:
- oss-standalone
build-variants:
- gcc:15.2.0-amd64-debian-bookworm-default
- gcc:15.2.0-arm64-debian-bookworm-default
- dockerhub
clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: --pipeline 10 -R --data-size 64 --command "SETBIT __key__ 8191 1"
    --command-key-pattern "R" --command "SET __key__ __data__" --command-key-pattern "R"
    --key-minimum 1 --key-maximum 1000000 --distinct-client-seed -c 50 -t 2
    --hide-histogram --test-time 120
  resources:
    requests:
      cpus: '2'
      memory: 2g
exporter:
  redistimeseries:
    metrics:
    - $."ALL STATS".Setbits."Ops/sec"
priority: 19
