version: 0.4
name: memtier_benchmark-12Mkeys-string-1KiB-random-bgsave-duration
description: Measure one BGSAVE after preloading 12M RAW string keys with random 1024-byte
  values. No concurrent writes, automatic saves, AOF or replicas. RdbLastBgsaveTimeSec is
  the whole-second post-fork save duration through parent completion handling; RdbLastForkUsec
  reports fork time separately. Use explicit selection on qualified disk runners and independent
  repetitions. Lower is better. Whole-second quantization limits sensitivity to small changes.
  This is not durable fsync or client tail latency. The matched repeated-payload test provides
  a highly compressible extreme control. Coordinator perf/topdown capture is disabled until
  save-phase collection is supported.
dbconfig:
  configuration-parameters:
    save: '""'
    maxmemory-policy: noeviction
    rdbcompression: 'yes'
    rdbchecksum: 'yes'
    appendonly: 'no'
  check:
    keyspacelen: 12000000
  preload_tool:
    run_image: redislabs/memtier_benchmark@sha256:356231d6b1baecaaa74d347f82f3c32b40f7da7f0b1dd5b1dab329c5d245f761
    tool: memtier_benchmark
    arguments: --data-size 1024 --ratio 1:0 -n allkeys --pipeline 50 --key-maximum 12000000
      --key-pattern P:P --key-minimum 1 --hide-histogram -t 8 -c 25 --random-data
  resources:
    requests:
      memory: 20g
  dataset_name: 12Mkeys-string-1KiB-random-size
  dataset_description: 12 million string keys with random 1024-byte values; exact DBSIZE is
    enforced.
  wait_for_bgsave: true
  skip_throughput_floor: true
tested-commands:
- bgsave
redis-topologies:
- oss-standalone
build-variants:
- gcc:15.2.0-amd64-debian-bookworm-default
- gcc:15.2.0-arm64-debian-bookworm-default
clientconfig:
  run_image: redislabs/memtier_benchmark@sha256:356231d6b1baecaaa74d347f82f3c32b40f7da7f0b1dd5b1dab329c5d245f761
  tool: memtier_benchmark
  arguments: --command "BGSAVE" -n 1 -c 1 -t 1 --hide-histogram
  resources:
    requests:
      cpus: '2'
      memory: 1g
tested-groups:
- server
exporter:
  redistimeseries:
    metrics:
    - $."ALL STATS".Totals.RdbLastBgsaveTimeSec
    - $."ALL STATS".Totals.RdbLastForkUsec
priority: 50
