version: 0.4
name: memtier_benchmark-1key-zset-128-elements-listpack-integer-members-zrandmember-count-200
description: 'Runs memtier_benchmark against 1 SORTED SET key with 128 members. Encoding: listpack (128 members, at the zset-max-listpack-entries limit; members are integers 0 to 127, stored as listpack integers). ZRANDMEMBER with a positive count of 200 returns the whole set, so every reply formats each member from a listpack integer. Metric of interest: Ops/sec. The command is read-only, so the set never changes during the run.'
