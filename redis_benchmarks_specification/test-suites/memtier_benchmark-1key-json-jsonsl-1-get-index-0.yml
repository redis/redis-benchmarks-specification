version: 0.4
name: memtier_benchmark-1key-json-jsonsl-1-get-index-0
description: |
  Measures Ops/sec for JSON.GET of the first element of the root array (`$.[0]`, a string).
  jsonsl-1 is the 970-byte JSON test pattern array of RedisJSON's performance.docs dataset (escapes,
  nested arrays and objects, numbers in every notation).
  Report throughput for this loaded client population (16 connections, 8 per thread x 2 threads,
  pipeline 1, 120-second measured phase); sampled response-latency percentiles describe the same load.
  The client shape is the one of the RedisJSON spec (redis-benchmark -c 16 --threads 2 -P 1); memtier
  replaces redis-benchmark so the rbs runner can drive it.
  Port of RedisJSON tests/benchmarks/json_get_[0]_jsonsl-1.yml, whose dataset is an RDB file loaded by
  the server. The document is loaded client-side by an init command (JSON.SET of the exact document
  text at the root, so a rerun restores it), not from an RDB file, so the suite runs against an
  endpoint where files cannot be placed; it carries no exact keyspace check, so it also runs on a
  database that holds other suites' keys. The last init command issues the measured command once: an
  error reply, for example from a server whose JSONPath dialect rejects the path or an endpoint that
  does not allow the command, aborts the suite instead of reporting a throughput number for error
  replies.
  The suite needs a server with RedisJSON (Redis 8 images bundle it); the gcc source builds do not
  ship the module, so only the dockerhub build variant is declared.

dbconfig:
  configuration-parameters:
    save: '""'
  resources:
    requests:
      memory: 1g
  init_commands:
    - ['JSON.SET', 'jsonsl-1', '$', '["JSON Test Pattern pass1",{"object with 1 member":["array with 1 element"]},{},[],-42,true,false,null,{"integer":1234567890,"real":-9876.54321,"e":1.23456789e-13,"E":1.23456789e34,"":2.3456789011999997e76,"zero":0,"one":1,"space":" ","quote":"\"","backslash":"\\","controls":"\b\f\n\r\t","slash":"/ & /","alpha":"abcdefghijklmnopqrstuvwyz","ALPHA":"ABCDEFGHIJKLMNOPQRSTUVWYZ","digit":"0123456789","0123456789":"digit","special":"`1~!@#$%^&*()_+-={'':[,]}|;.</>?","hex":"ģ䕧覫췯ꯍ","true":true,"false":false,"null":null,"array":[],"object":{},"address":"50 St. James Street","url":"http://www.JSON.org/","comment":"// /* <!-- --","# -- --> */":" "," s p a c e d ":[1,2,3,4,5,6,7],"compact":[1,2,3,4,5,6,7],"jsontext":"{\"object with 1 member\":[\"array with 1 element\"]}","quotes":"&#34; \" %22 0x22 034 &#x22;","/\\\"쫾몾ꮘﳞ볚\b\f\n\r\t`1~!@#$%^&*()_+-=[]{}|;:'',./<>?":"A key can be any string"},0.5,98.6,99.44,1066,10.0,1.0,0.1,1.0,2.0,2.0,"rosebud"]']
    - ['JSON.GET', 'jsonsl-1', '$.[0]']

tested-groups:
- json

tested-commands:
- json.get

redis-topologies:
- oss-standalone

build-variants:
- dockerhub

clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: >
    -c 8 -t 2
    --distinct-client-seed
    --pipeline=1
    --print-percentiles=50,90,95,99
    --run-count=1
    --test-time=120
    --command="JSON.GET jsonsl-1 $.[0]"
    --command-key-pattern=R
    --hide-histogram
  resources:
    requests:
      cpus: '4'
      memory: 2g

priority: 150
