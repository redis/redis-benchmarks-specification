version: 0.4
name: memtier_benchmark-10000keys-set-100-elements-spop-whole-set-bounded
description: 'Runs memtier_benchmark against a keyspace of 10,000 SET keys of 100 members
  each, issuing exactly one SPOP key 100 call per key (BOUNDED via -n 10000 at -c 1 -t 1,
  with the P pattern drawing each key exactly once). Because the requested count equals the
  set size, spopWithCountCommand takes its CASE 1 path: it hands the whole 100-member set to
  the client, DELETES the key, and rewrites the propagation as a single DEL/UNLINK -- the
  only shape that reaches that rewrite-to-DEL code, which the small-count specs
  (memtier_benchmark-1key-set-1M-elements-hashtable-spop-count-5-bounded and
  memtier_benchmark-1Mkeys-set-120-elements-listpack-spop-count-5-bounded) and the CASE 3
  spec (memtier_benchmark-2000keys-set-10K-elements-hashtable-spop-count-9K-bounded) never
  hit. SPOP is destructive and CASE 1 removes each key outright, so the client is capped at
  exactly one pop per set -- every call measures the CASE 1 path and the run never touches
  the empty-set fast-return. PRELOAD: SADD spopfull:set:__key__ __data__ with --data-size 10
  --random-data over the P pattern cycles every key exactly 100 times (-n 1000000 / 10000
  keys); --random-data is mandatory for set preloads because memtier fills the data buffer
  with a constant without it, which would collapse every set to a single member and shrink
  the measured reply from 100 elements to 1 -- with it, one buffer byte is mutated per
  request so all members stay distinct (verified at reduced scale: 10 keys / -n 1000 yielded
  SCARD exactly 100 per key, listpack-encoded, and SPOP key 100 returned all 100 members and
  deleted the key). Random 10-byte non-integer members keep every set listpack-encoded (100
  entries, below set-max-listpack-entries 128). The keyspace check observes the 10,000
  preloaded keys before the client phase; after the run the keyspace is empty by
  construction. Metric of interest: Ops/sec. SPOP whole-set CASE 1 had zero benchmark
  coverage before this spec.'
dbconfig:
  configuration-parameters:
    save: '""'
  check:
    keyspacelen: 10000
  resources:
    requests:
      memory: 1g
  preload_tool:
    run_image: redislabs/memtier_benchmark:edge
    tool: memtier_benchmark
    arguments: '"--data-size" "10" --random-data --command "SADD spopfull:set:__key__ __data__" --command-key-pattern="P"
      --key-minimum=1 --key-maximum=10000 --key-prefix "" -n 1000000 -c 1 -t 1 --hide-histogram
      --pipeline 50'
  dataset_name: 10000keys-set-100-members-10B
  dataset_description: This dataset contains 10,000 set keys with 100 distinct members of 10
    bytes each (listpack-encoded, below set-max-listpack-entries 128).
tested-groups:
- set
tested-commands:
- spop
redis-topologies:
- oss-standalone
build-variants:
- gcc:15.2.0-amd64-debian-bookworm-default
- gcc:15.2.0-arm64-debian-bookworm-default
- dockerhub
clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: --command="SPOP spopfull:set:__key__ 100" --command-key-pattern=P --key-minimum
    1 --key-maximum 10000 --key-prefix "" -n 10000 -c 1 -t 1 --pipeline 1 --hide-histogram
  resources:
    requests:
      cpus: '4'
      memory: 2g
priority: 73
