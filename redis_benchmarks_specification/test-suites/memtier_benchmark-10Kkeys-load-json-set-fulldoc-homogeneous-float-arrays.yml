version: 0.4
name: memtier_benchmark-10Kkeys-load-json-set-fulldoc-homogeneous-float-arrays
description: |
  Measures Ops/sec for JSON.SET of an 11,666-byte document holding one array of 1,024 floats with
  three decimals at the root path `$` of a random key out of 10,000: the module parses the 11,666-byte
  document text into its JSON data structure and stores it, dropping the previous document of that
  key. The array is stored in the typed numeric array representation, so the parse builds a typed
  float array.
  Report throughput for this loaded client population (16 connections, 8 per thread x 2 threads,
  pipeline 1, 120-second measured phase); sampled response-latency percentiles describe the same load.
  Writes go to keys json-load:1 .. json-load:10000; nothing is preloaded, so the measured phase starts
  with creates and turns into overwrites (dropping the previous document) as the keyspace fills, as in
  the RedisJSON spec. The suite has no keyspace check, so it runs with or without a FLUSHALL before
  it. An init command writes the document once to json-load:1 first: an error reply (a server that
  rejects the document or its size) aborts the suite.
  From the ijson campaign's proposal json_set_homogeneous_float_arrays (a sibling of RedisJSON's
  json_set_homogeneous_integer_arrays); 10,000 keys instead of the sibling's 100,000 keep the
  endpoint's memory near 100 MB.
  The suite needs a server with RedisJSON (Redis 8 images bundle it); the gcc source builds do not
  ship the module, so only the dockerhub build variant is declared.

