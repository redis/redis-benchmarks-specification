version: 0.4
name: memtier_benchmark-5Kkeys-string-80KiB-get-pipeline-16-maxmemory-clients-enabled
description: |
  Measures the main-thread user CPU cost per GET during the client phase with
  client-memory accounting enabled and no evictions allowed. The dataset is
  5000 RAW strings of 81910 random bytes; replies can reference keyspace objects
  on Redis versions supporting reply copy-avoidance. Pipeline 16, 100 connections
  and 120 seconds keep large replies queued. This is a loaded phase cost,
  including client connection setup and background cron, not intrinsic GET latency.
  ClientPhaseUserCpuSecondsPerGet divides the before/after main-thread user CPU
  delta by the matching GET-call delta; preload CPU is excluded. Raw INFO CPU
  counters remain available but must not be divided directly by GET calls.
  A nonzero eviction delta invalidates this no-eviction control. Compare only
  matching server versions, allocator, topology and client settings. A fleet pilot
  must establish queued shared replies before attributing a change to that path.
  The 81910-byte payload plus SDS header and NUL fits the 81920-byte jemalloc bin.
client-memory-metrics:
  maxmemory-clients: 1073741824
  max-evicted-clients: 0
exporter:
  redistimeseries:
    metrics:
    - $."ALL STATS".Totals.ClientPhaseUserCpuSeconds
    - $."ALL STATS".Totals.ClientPhaseGetCalls
    - $."ALL STATS".Totals.ClientPhaseUserCpuSecondsPerGet
    - $."ALL STATS".Totals.ClientPhaseEvictedClients
dbconfig:
  configuration-parameters:
    save: '""'
    maxmemory-clients: 1gb
  init_commands:
  - '"CONFIG" "SET" "maxmemory-clients" "1gb"'
  check:
    keyspacelen: 5000
  preload_tool:
    run_image: redislabs/memtier_benchmark:edge
    tool: memtier_benchmark
    arguments: --data-size 81910 -R --ratio 1:0 -n allkeys --pipeline 50 --key-maximum
      5000 --key-pattern P:P --key-minimum 1 --hide-histogram -t 4 -c 10
  resources:
    requests:
      memory: 4g
  dataset_description: 5000 RAW string keys, each holding an 80KiB random value
    (~410MB). On supporting builds, queued replies can share these large values;
    verify that path on the fleet before attributing CPU changes to it.
tested-groups:
- string
tested-commands:
- get
redis-topologies:
- oss-standalone
build-variants:
- gcc:15.2.0-amd64-debian-bookworm-default
- gcc:15.2.0-arm64-debian-bookworm-default
- dockerhub
clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: --command "GET __key__" --command-key-pattern="R" --key-minimum=1 --key-maximum
    5000 --test-time 120 --pipeline 16 -c 25 -t 4 --hide-histogram
  resources:
    requests:
      cpus: '4'
      memory: 4g
priority: 60
