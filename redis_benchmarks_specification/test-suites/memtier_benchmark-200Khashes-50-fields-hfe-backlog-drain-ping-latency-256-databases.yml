version: 0.4
name: memtier_benchmark-200Khashes-50-fields-hfe-backlog-drain-ping-latency-256-databases
description: |-
  Measures client-visible PING tail latency (the metric of interest: p99.9, with
  p50/p99/p99.99 secondary) while the server drains a synchronized backlog of 10,000,000
  expired HASH fields. The 200,000 hashes are forced onto the HASHTABLE encoding
  (`hash-max-listpack-entries 0`, 50 x 10B fields each), so hash-field expiration uses the
  hashtable/ebuckets active-expire path rather than listpackex.

  Why a synchronized cohort rather than a TTL spread: the subject here is the active
  sub-expiry CYCLE, not the per-call cost of an expiry command, and specifically the cycle's
  behaviour when the pending-field backlog at a cron tick far exceeds the per-cycle field
  quota. memtier's `--expiry-range` only applies to its own native SET path, so an HFE TTL
  can only come from literal command text and is necessarily constant; the backlog is instead
  established atomically by an `init_lua` pass that HPEXPIREs every field after preload and
  before the measured window, which is the shape the suite had no coverage for. A TTL-spread
  trickle is deliberately NOT what this spec measures.

  Load model is open-loop on purpose: 1,000 offered ops/sec of PING (4 connections x
  `--rate-limiting=250`, `--pipeline 1`), far below saturation. PING is used so the probe
  itself does no keyspace work and cannot lazily expire any of the backlog -- it measures
  only main-thread availability. Because Redis is single-threaded, any active-expire cycle
  that overruns delays every in-flight request, so the probe's tail is a direct read of the
  longest cycle. A closed-loop probe would under-sample the stall (only the in-flight
  requests would be delayed); the fixed arrival rate makes the number of delayed samples
  proportional to the stall duration instead.

  `Ops/sec` is exported as a sanity metric only: it should sit at the offered 1,000 ops/sec,
  and a shortfall means the drain delayed even the offered load.

  This is the `databases 256` arm. It is byte-identical to its sibling
  `memtier_benchmark-200Khashes-50-fields-hfe-backlog-drain-ping-latency` apart from the
  database count, so the difference between the two tails isolates the effect of the
  configured database count on active sub-expiry cycle length.
dbconfig:
  configuration-parameters:
    save: '""'
    appendonly: 'no'
    # Force HASHTABLE encoding for every hash regardless of field count, so the
    # 50-field hashes exercise the hashtable/ebuckets HFE path, not listpackex.
    hash-max-listpack-entries: '0'
    # The init_lua backlog pass below is a long single script; keep the server from
    # replying BUSY to the harness health-check while it runs.
    busy-reply-threshold: '60000'
    # The dose: 256 databases instead of the default 16.
    databases: '256'
  check:
    keyspacelen: 200000
  preload_tool:
    run_image: redislabs/memtier_benchmark:edge
    tool: memtier_benchmark
    arguments: >
      --key-prefix ""
      --data-size 10
      --command "HSET hfe:__key__ f1 __data__ f2 __data__ f3 __data__ f4 __data__ f5 __data__ f6 __data__ f7 __data__ f8 __data__ f9 __data__ f10 __data__ f11 __data__ f12 __data__ f13 __data__ f14 __data__ f15 __data__ f16 __data__ f17 __data__ f18 __data__ f19 __data__ f20 __data__ f21 __data__ f22 __data__ f23 __data__ f24 __data__ f25 __data__ f26 __data__ f27 __data__ f28 __data__ f29 __data__ f30 __data__ f31 __data__ f32 __data__ f33 __data__ f34 __data__ f35 __data__ f36 __data__ f37 __data__ f38 __data__ f39 __data__ f40 __data__ f41 __data__ f42 __data__ f43 __data__ f44 __data__ f45 __data__ f46 __data__ f47 __data__ f48 __data__ f49 __data__ f50 __data__"
      --command-key-pattern="P"
      --key-minimum=1
      --key-maximum=200001
      -n 200000
      -c 1 -t 1
      --hide-histogram
      --pipeline 50
  # Runs AFTER the preload and BEFORE the measured window, so the whole 10M-field
  # backlog becomes due at a single instant. Active expiry cannot run while the
  # script executes, so the first cron tick after it returns sees the full backlog.
  init_lua: |-
    for k=1,200000 do
    redis.call('HPEXPIRE','hfe:'..k,1,'FIELDS',50,'f1','f2','f3','f4','f5','f6','f7','f8','f9','f10','f11','f12','f13','f14','f15','f16','f17','f18','f19','f20','f21','f22','f23','f24','f25','f26','f27','f28','f29','f30','f31','f32','f33','f34','f35','f36','f37','f38','f39','f40','f41','f42','f43','f44','f45','f46','f47','f48','f49','f50')
    end
    return 1
  resources:
    requests:
      memory: 6g
  dataset_name: 200Khashes-50-fields-10B-hashtable-hfe
  dataset_description: 200,000 hashes of 50 10-byte fields each (10,000,000 fields total),
    HASHTABLE-encoded, with a hash-field TTL applied to every field after preload.
# tested-commands/groups reflect the measured client (the PING probe). The HSET
# preload and the HPEXPIRE init pass only establish the state being drained.
tested-commands:
- ping
tested-groups:
- connection
redis-topologies:
- oss-standalone
build-variants:
- gcc:15.2.0-amd64-debian-bookworm-default
- gcc:15.2.0-arm64-debian-bookworm-default
- dockerhub
clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: >
    --command "PING"
    -c 4 -t 1
    --rate-limiting=250
    --pipeline 1
    --test-time 60
    --print-percentiles=50,99,99.9,99.99
    --hide-histogram
  resources:
    requests:
      cpus: '2'
      memory: 1g
exporter:
  redistimeseries:
    timemetric: $."ALL STATS".Runtime."Start time"
    metrics:
    - $."ALL STATS".Totals."Ops/sec"
    - $."ALL STATS".Totals."Percentile Latencies"."p50.00"
    - $."ALL STATS".Totals."Percentile Latencies"."p99.00"
    - $."ALL STATS".Totals."Percentile Latencies"."p99.90"
    - $."ALL STATS".Totals."Percentile Latencies"."p99.99"
priority: 100
