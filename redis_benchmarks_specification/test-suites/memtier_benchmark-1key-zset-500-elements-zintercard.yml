version: 0.4
name: memtier_benchmark-1key-zset-500-elements-zintercard
description: 'Runs memtier_benchmark issuing ZINTERCARD with numkeys=1 over a single sorted set
  ''ov:1'' of 500 members m:1..m:500 (3-5 byte members, score = index), so the reply is always the
  integer 500. With a single input there is no other input to look candidates up in: every member of
  ov:1 is iterated and counted. Same dataset shape as one key of the 2/3/8/64-key 500-element
  suites. It is meant for attribution: the per-call time of the 2-key suite minus this one
  (usec_per_call, or 1/Ops/sec, not Ops/sec itself) approximates the cost of the lookups into the
  second input. It is not a standalone regression signal. Encoding: skiplist through 8.10.x, btree
  (OBJ_ENCODING_BTREE) from 8.12 (500 elements, above zset-max-listpack-entries 128). Load: memtier
  defaults (4 threads x 50 clients, pipeline 1), the same as the existing ZINTER/ZINTERCARD suites
  so results line up with them. Unlike the existing 2-key and 8-key ZINTERCARD suites, which preload
  64 keys, this suite preloads only the 1 key it queries. Metric of interest: Ops/sec.'
dbconfig:
  configuration-parameters:
    save: '""'
  check:
    keyspacelen: 1
  resources:
    requests:
      memory: 1g
  init_lua: |
    -- 1 sorted set holding the 500-member set m:1..m:500 (score = index).
    for m = 1, 500 do
      redis.call('ZADD', 'ov:1', m, 'm:' .. m)
    end
    return 1
  dataset_name: 1key-sorted-set-500-elements
  dataset_description: 1 sorted set ov:1 containing the 500 members m:1..m:500 (score = index).
tested-commands:
- zintercard
redis-topologies:
- oss-standalone
build-variants:
- gcc:15.2.0-amd64-debian-bookworm-default
- gcc:15.2.0-arm64-debian-bookworm-default
- dockerhub
clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: --command="ZINTERCARD 1 ov:1 LIMIT 0"  --hide-histogram --test-time 120
  resources:
    requests:
      cpus: '4'
      memory: 2g
tested-groups:
- sorted-set
priority: 131
