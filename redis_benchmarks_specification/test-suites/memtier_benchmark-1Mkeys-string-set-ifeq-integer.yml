version: 0.4
name: memtier_benchmark-1Mkeys-string-set-ifeq-integer
description: |
  Measures Ops/sec of the conditional SET ... IFEQ <value> path in
  setGenericCommand() (src/t_string.c) when the current value is
  integer-encoded (OBJ_ENCODING_INT, value 12345, above the shared-integer
  range). IFEQ compares the current value as a string, so an integer-encoded
  value must be rendered as a string for the comparison. The condition always
  matches and the write stores the same value, so the keyspace stays the same
  (and stays integer-encoded) during the run. Pipeline 16 to make per-command
  overhead visible.
dbconfig:
  configuration-parameters:
    save: '""'
  check:
    keyspacelen: 1000000
  preload_tool:
    run_image: redislabs/memtier_benchmark:edge
    tool: memtier_benchmark
    arguments: '--command "SET __key__ 12345" --command-key-pattern P --key-minimum 1 --key-maximum 1000000 -n allkeys -c 50 -t 2 --pipeline 50 --hide-histogram'
  resources:
    requests:
      memory: 1g
  dataset_name: 1Mkeys-string-integer-12345
  dataset_description: 1 million string keys, each holding the integer 12345 (OBJ_ENCODING_INT).
tested-commands:
- set
tested-groups:
- string
redis-topologies:
- oss-standalone
build-variants:
- gcc:15.2.0-amd64-debian-bookworm-default
- gcc:15.2.0-arm64-debian-bookworm-default
- dockerhub
clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: '--command "SET __key__ 12345 IFEQ 12345" --command-key-pattern R --key-minimum 1 --key-maximum 1000000 --distinct-client-seed --test-time 120 -c 25 -t 8 --pipeline 16 --hide-histogram'
  resources:
    requests:
      cpus: '8'
      memory: 2g
priority: 1
