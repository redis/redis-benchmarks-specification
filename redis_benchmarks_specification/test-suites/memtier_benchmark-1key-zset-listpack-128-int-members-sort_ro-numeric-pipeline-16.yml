version: 0.4
name: memtier_benchmark-1key-zset-listpack-128-int-members-sort_ro-numeric-pipeline-16
description: >
  SORT_RO on a listpack sorted set (128 integer members). Metric of interest: Ops/sec with
  pipeline 16 and 50 connections. Measures element loading, optional sorting, and reply
  generation together. This complements the SORT pipeline-10 specs with a distinct command and
  load configuration; do not subtract their rates to attribute individual costs. Redis
  versions that convert the source zset on SORT_RO measure the converted encoding after the
  first request; verify the steady-state encoding when comparing versions.
dbconfig:
  configuration-parameters:
    save: '""'
    zset-max-listpack-entries: '256'
  check:
    keyspacelen: 1
  preload_tool:
    run_image: redislabs/memtier_benchmark:edge
    tool: memtier_benchmark
    arguments: --command="ZADD sortz:lp128 1 __key__" --command-key-pattern=P --key-minimum 1 --key-maximum 128 -n 128 --key-prefix "" --hide-histogram -t 1 -c 1 --pipeline 50
  resources:
    requests:
      memory: 1g
  dataset_name: sortz-lp128
  dataset_description: 1 ZSET key, 128 integer members, all score 1 (listpack order is lexicographic, so numeric order is shuffled).
tested-groups:
- generic
tested-commands:
- sort_ro
redis-topologies:
- oss-standalone
build-variants:
- gcc:15.2.0-amd64-debian-bookworm-default
- gcc:15.2.0-arm64-debian-bookworm-default
- dockerhub
clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: --pipeline 16 --command="SORT_RO sortz:lp128" --hide-histogram --test-time 120 -c 25 -t 2
  resources:
    requests:
      cpus: '4'
      memory: 2g
priority: 90
