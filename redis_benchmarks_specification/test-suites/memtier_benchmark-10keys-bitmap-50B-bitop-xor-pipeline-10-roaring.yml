version: 0.4
name: memtier_benchmark-10keys-bitmap-50B-bitop-xor-pipeline-10-roaring
description: >
  Roaring variant of memtier_benchmark-10keys-bitmap-50B-bitop-xor-pipeline-10. The server
  runs with bitmap-default-roaring yes, so the preload creates Roaring bitmaps (OBJECT
  ENCODING bitmap-roaring) instead of plain strings, and the measured command runs against
  them. The preload sets bit 399 on each of key:1..key:10, so each source spans 50 bytes like
  the string spec; with Roaring sources BITOP takes the native path and writes a Roaring
  result. Keyspace and client arguments match the string spec, so the two are directly
  comparable. Needs a build with native compressed bitmaps.
dbconfig:
  configuration-parameters:
    save: '""'
    bitmap-default-roaring: 'yes'
  check:
    keyspacelen: 10
  preload_tool:
    run_image: redislabs/memtier_benchmark:edge
    tool: memtier_benchmark
    arguments: >
      --command "SETBIT __key__ 399 1"
      --command-key-pattern P
      --key-prefix "key:"
      --key-minimum 1
      --key-maximum 10
      -n 10
      -c 1
      -t 1
      --hide-histogram
  resources:
    requests:
      memory: 1g
  dataset_name: 10keys-bitmap-50B-roaring
  dataset_description: 10 Roaring bitmap keys (key:1..key:10), each with bit 399 set so the logical bitmap spans 50 bytes.
tested-commands:
- bitop
tested-groups:
- bitmap
redis-topologies:
- oss-standalone
build-variants:
- gcc:15.2.0-amd64-debian-bookworm-default
- gcc:15.2.0-arm64-debian-bookworm-default
- dockerhub
clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: >
    --command "BITOP XOR tmp key:1 key:2 key:3 key:4 key:5 key:6 key:7 key:8 key:9 key:10"
    --command-key-pattern R
    --hide-histogram
    --test-time 180
    --pipeline 10
    -c 1
    -t 1
  resources:
    requests:
      cpus: '2'
      memory: 2g
priority: 67
