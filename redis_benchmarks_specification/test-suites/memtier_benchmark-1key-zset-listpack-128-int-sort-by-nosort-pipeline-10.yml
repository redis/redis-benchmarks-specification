  dataset_description: >-
    1 SORTED SET key `sort:zset:lp:128:int:bynosort` with 128 integer-encoded members (integer scores
    1..128 shuffled, integer members drawn without replacement from 1..1_000_000).
    Encoding is listpack (zset-max-listpack-entries raised to 256).
tested-groups:
- generic
tested-commands:
- sort
redis-topologies:
- oss-standalone
build-variants:
- gcc:15.2.0-amd64-debian-bookworm-default
- gcc:15.2.0-arm64-debian-bookworm-default
- dockerhub
clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: --pipeline 10 --command="SORT sort:zset:lp:128:int:bynosort BY nosort" --hide-histogram --test-time 120
  resources:
    requests:
      cpus: '4'
      memory: 2g
priority: 34
