version: 0.4
name: memtier_benchmark-1key-zset-listpack-128-int-sort-by-nosort-pipeline-10
description: >-
  Runs memtier_benchmark against a single SORTED SET key with 128 integer-encoded
  members, measuring the throughput of `SORT ... BY nosort`. With `BY nosort` the
  sort step is skipped entirely — the benchmark isolates the listpack-zset
  element-materialization cost of the vector-loading path (the `BY nosort` range
  loop in `sortCommandGeneric()`), without the comparator cost.

  Companion to `1key-zset-listpack-128-int-sort-numeric-pipeline-10`: the
  delta between the two decomposes the end-to-end SORT cost into
  materialization (this spec) vs. comparator + reply (the other). Issue #632
  identifies the `BY nosort` path on a listpack zset source as unmeasured today.

  Encoding: listpack. Same shape as the numeric-SORT spec with distinct key name
  to keep workloads independent.
dbconfig:
  configuration-parameters:
    save: '""'
    zset-max-listpack-entries: '256'
  check:
    keyspacelen: 1
