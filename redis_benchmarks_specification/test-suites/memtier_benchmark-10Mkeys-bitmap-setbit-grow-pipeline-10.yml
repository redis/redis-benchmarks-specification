version: 0.4
name: memtier_benchmark-10Mkeys-bitmap-setbit-grow-pipeline-10
description: >-
  Runs memtier_benchmark against 10M bitmap keys to measure the SETBIT allocation-growth
  path. Every key is preloaded as a 1-byte raw-encoded bitmap and the measured phase
  writes bit 511 of each key exactly once, so every operation extends the value from 1 to
  64 bytes: lookupStringForBitCommand() calls sdsgrowzero(), which reallocates and
  zero-fills the new tail, followed by signalModifiedKey, server.dirty and the keysizes
  histogram update. Measured grow fraction is exactly 1.000 - the dirty counter advances
  by exactly one per key, with no operation falling onto the unchanged fast path. Metric
  of interest is Ops/sec at pipeline 10.

  Exactly-once coverage comes from --command-key-pattern P plus a fixed request count:
  each of the 100 connections owns a disjoint 100000-wide subrange and walks it once.
  That property is a three-way coupling - a SINGLE --command stream, and -n equal to the
  key range divided by t*c. Each --command stream owns its own key iterator, so adding a
  second stream halves the ids covered per connection, and changing -c or -t without
  changing -n breaks exactly-once silently while keyspacelen still passes.

  The fixed request count replaces --test-time on purpose: a bitmap only ever grows, so an
  extended key can never be re-grown and this path cannot be held hot in steady state.
  Fixed work also makes both sides of a comparison traverse an identical state trajectory,
  so the delta is speed rather than a differing mix of grown and already-grown keys. This
  follows existing practice - 1key-set-2M-elements-sadd-increasing, the
  1Mkeys-list-lpop-rpop-* family and playbook-feature-store-hash-ingest-10M-entities-50-features
  all use a fixed count for the same reason.

  Operationally: with no --test-time the harness applies a HARD 300s default container
  timeout, and exceeding it raises rather than truncating, so the result is a failed test
  and zero datapoints, not a slow number. 10M operations therefore need a sustained 33k
  ops/s. Measured end to end with these exact arguments on an idle 14-core box: 21s
  preload, then 29s for the measured phase at 370k ops/s - a 10x margin to the cap. The
  same phase under heavy contention has been observed at 100k ops/s, which is still a 3x
  margin. The size was chosen for that margin because the failure mode is correlated with
  the regression this spec exists to detect: a build that slows the grow path pushes the
  run toward the cap, so an under-margined spec goes silent on exactly the commits it
  should flag. Note
  --override-memtier-test-time cannot shorten this spec (it only rewrites an existing
  --test-time), and --test-time cannot be added as a guard because it is mutually
  exclusive with a request count.

  Two things this spec does not reach. sdsgrowzero() grows greedily, so a 64-byte target
  allocates 128 bytes plus header (a 160-byte size class) and the value crosses from
  SDS_TYPE_5 to SDS_TYPE_8 - which means _sdsMakeRoomFor() takes its malloc/memmove/free
  path and never its in-place s_realloc_usable() branch. Measured footprint once fully
  grown is 217 bytes per key of used_memory - 2.02GiB at 10M keys, with used_memory_rss
  2.07GiB, a fragmentation ratio near 1.02. Sweep order is sequential by id within each
  subrange, so allocator locality is more favourable than a random-order grow.
dbconfig:
  configuration-parameters:
    save: '""'
  check:
    keyspacelen: 10000000
  preload_tool:
    run_image: redislabs/memtier_benchmark:edge
    tool: memtier_benchmark
    arguments: --hide-histogram --key-minimum 1 --key-maximum 10000000 -n 100000
      --command "SETBIT __key__ 0 1" --command-key-pattern "P" --pipeline 50 -c 50
      -t 2
  resources:
    requests:
      cpus: '2'
      memory: 4g
  dataset_name: 10Mkeys-bitmap-8bits-growable
  dataset_description: This dataset contains 10M raw-encoded bitmap keys, each a single
    byte with bit 0 set. Any write at an offset of 8 or above must extend the allocation,
    which is what makes this dataset a probe for the SETBIT growth path.
tested-commands:
- setbit
tested-groups:
- bitmap
redis-topologies:
- oss-standalone
build-variants:
- gcc:15.2.0-amd64-debian-bookworm-default
- gcc:15.2.0-arm64-debian-bookworm-default
- dockerhub
clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: --pipeline 10 --command "SETBIT __key__ 511 1" --command-key-pattern "P"
    --key-minimum 1 --key-maximum 10000000 -n 100000 -c 50 -t 2 --hide-histogram
  resources:
    requests:
      cpus: '2'
      memory: 2g
priority: 105
