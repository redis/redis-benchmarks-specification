  dataset_description: 'This dataset contains 1 sorted set key with 100 random 10-character lowercase
    members, all with a constant score of 0. A constant score is required for BYLEX range semantics to
    be meaningful: with equal scores the ordering is purely lexicographical. Same member list as the 1key-zset-100-elements-float
    dataset used by the by-score specs.'
tested-groups:
- sorted-set
tested-commands:
- zrangebylex
redis-topologies:
- oss-standalone
build-variants:
- gcc:15.2.0-amd64-debian-bookworm-default
- gcc:15.2.0-arm64-debian-bookworm-default
- dockerhub
clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: --command="ZRANGEBYLEX zset:100 - +"  --hide-histogram --test-time 180
  resources:
    requests:
      cpus: '4'
      memory: 2g
priority: 7
