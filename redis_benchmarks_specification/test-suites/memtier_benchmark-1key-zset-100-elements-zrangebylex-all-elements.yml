version: 0.4
name: memtier_benchmark-1key-zset-100-elements-zrangebylex-all-elements
description: 'Runs memtier_benchmark, for a keyspace length of 1 SORTED SET key. The SORTED SET contains
  100 members (random 10-character lowercase strings, all with a constant score of 0) and we query it
  using ZRANGEBYLEX with the full lex range - +, returning all 100 elements in lexicographical order.
  A constant score is required for BYLEX semantics: with equal scores the ordering is purely lexicographical
  (with the distinct float scores of the sibling by-score dataset, ZRANGEBYLEX would filter in (score,member)
  order and the lex ordering would be meaningless). This is the by-lex mirror of memtier_benchmark-1key-zset-100-elements-zrangebyscore-all-elements:
  same element count, same full-range scan shape, but the range endpoints are parsed through zslParseLexRange
  and elements are compared with sdscmplen instead of double score compares. Encoding: listpack (100 elements,
  below zset-max-listpack-entries 128) -- so this spec covers the listpack linear-scan lex path; the skiplist
  lex path at scale is covered by the 1M-elements by-lex siblings. Metric of interest: Ops/sec.'
dbconfig:
  configuration-parameters:
    save: '""'
  check:
    keyspacelen: 1
  resources:
    requests:
      memory: 1g
  init_commands:
  - '"ZADD" "zset:100" "0" "lysbgqqfqw" "0" "mtccjerdon" "0" "jekkafodvk" "0" "nmgxcctxpn" "0" "vyqqkuszzh"
