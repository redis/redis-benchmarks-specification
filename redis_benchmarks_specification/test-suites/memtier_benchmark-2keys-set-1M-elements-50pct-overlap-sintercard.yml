version: 0.4
name: memtier_benchmark-2keys-set-1M-elements-50pct-overlap-sintercard
description: 'Join on sets too big for the cache. SINTERCARD over 2 hashtable-encoded
  sets of 1M non-integer members each with 50% overlap. set:a holds m:0..m:999999;
  set:b holds m:500000..m:1499999; intersection cardinality is 500000. Members are
  non-integer strings (m:<i>) so both sets are hashtable, not intset. Encoding:
  hashtable (1,000,000 elements, exceeds set-max-listpack-entries 128). Metric of
  interest: Ops/sec.'
dbconfig:
  configuration-parameters:
    save: '""'
    lua-time-limit: '30000'
  check:
    keyspacelen: 2
  resources:
    requests:
      memory: 2g
  init_lua: |
    -- Preload 2 sets × 1M non-integer members, 50% overlap, via batched SADD.
    local batch = 500
    -- set:a = m:0..m:999999
    for b = 0, 999999, batch do
      local args = {'set:a'}
      for j = 0, batch-1 do args[#args+1] = 'm:' .. (b + j) end
      redis.call('SADD', unpack(args))
    end
    -- set:b = m:500000..m:1499999
    for b = 500000, 1499999, batch do
      local args = {'set:b'}
      for j = 0, batch-1 do args[#args+1] = 'm:' .. (b + j) end
      redis.call('SADD', unpack(args))
    end
    return 1
  dataset_name: 2keys-set-1M-elements-50pct-overlap-hashtable
  dataset_description: 2 hashtable sets of 1M non-integer members with 50% overlap
    (set:a=m:0..m:999999, set:b=m:500000..m:1499999). Intersection cardinality is
    500000.
tested-commands:
- sintercard
redis-topologies:
- oss-standalone
build-variants:
- gcc:15.2.0-amd64-debian-bookworm-default
- gcc:15.2.0-arm64-debian-bookworm-default
- dockerhub
clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: --command="SINTERCARD 2 set:a set:b" --hide-histogram --test-time 120
  resources:
    requests:
      cpus: '4'
      memory: 2g
tested-groups:
- set
priority: 1
