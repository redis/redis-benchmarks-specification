version: 0.4
name: memtier_benchmark-3keys-zset-500-elements-zintercard
description: 'Runs memtier_benchmark issuing ZINTERCARD over 3 sorted sets of 500 elements each. All
  3 keys hold the identical member set m:1..m:500 (100% overlap, 3-5 byte members), so the reply is
  always the integer 500 and only numkeys differs from the same-command suites. It covers numkeys=3,
  between the existing 2-key and 8-key suites. Encoding: skiplist through 8.10.x, btree
  (OBJ_ENCODING_BTREE) from 8.12 (every input holds 500 elements, above zset-max-listpack-entries
  128). Load: memtier defaults (4 threads x 50 clients, pipeline 1), the same as the existing
  ZINTER/ZINTERCARD suites so results line up with them. Unlike the existing 2-key and 8-key
  ZINTERCARD suites, which preload 64 keys, this suite preloads only the 3 keys it queries. Metric
  of interest: Ops/sec.'
dbconfig:
  configuration-parameters:
    save: '""'
  check:
    keyspacelen: 3
  resources:
    requests:
      memory: 1g
  init_lua: |
    -- 3 sorted sets all holding the identical 500-member set m:1..m:500.
    for k = 1, 3 do
      for m = 1, 500 do
        redis.call('ZADD', 'ov:' .. k, m, 'm:' .. m)
      end
    end
    return 1
  dataset_name: 3keys-sorted-set-500-elements-identical-members
  dataset_description: 3 sorted sets ov:1..ov:3, each containing the identical 500 members
    m:1..m:500 (score = index).
tested-commands:
- zintercard
redis-topologies:
- oss-standalone
build-variants:
- gcc:15.2.0-amd64-debian-bookworm-default
- gcc:15.2.0-arm64-debian-bookworm-default
- dockerhub
clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: --command="ZINTERCARD 3 ov:1 ov:2 ov:3 LIMIT 0"  --hide-histogram --test-time 120
  resources:
    requests:
      cpus: '4'
      memory: 2g
tested-groups:
- sorted-set
priority: 131
