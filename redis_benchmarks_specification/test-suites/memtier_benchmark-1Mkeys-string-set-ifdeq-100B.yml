version: 0.4
name: memtier_benchmark-1Mkeys-string-set-ifdeq-100B
description: |
  Measures Ops/sec of the conditional SET ... IFDEQ <digest> path in
  setGenericCommand() (src/t_string.c) on a 100-byte string value
  (OBJ_ENCODING_RAW, > 44 bytes). Every key holds the same 100-byte value, whose
  XXH3 digest is 87cc0c6687391089, so the condition always matches and the write lands.
  The new value equals the old one, so the keyspace stays the same during the
  run. Each call computes the digest of the current value before comparing.
  Pipeline 16 to make per-command overhead visible.
dbconfig:
  configuration-parameters:
    save: '""'
  check:
    keyspacelen: 1000000
  preload_tool:
    run_image: redislabs/memtier_benchmark:edge
    tool: memtier_benchmark
    arguments: '--command "SET __key__ vvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvv" --command-key-pattern P --key-minimum 1 --key-maximum 1000000 -n allkeys -c 50 -t 2 --pipeline 50 --hide-histogram'
  resources:
    requests:
      memory: 1g
  dataset_name: 1Mkeys-string-100B-constant-value
  dataset_description: 1 million string keys, each holding the same 100-byte value (100 x 'v', OBJ_ENCODING_RAW).
tested-commands:
- set
tested-groups:
- string
redis-topologies:
- oss-standalone
build-variants:
- gcc:15.2.0-amd64-debian-bookworm-default
- gcc:15.2.0-arm64-debian-bookworm-default
- dockerhub
clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: '--command "SET __key__ vvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvv IFDEQ 87cc0c6687391089" --command-key-pattern R --key-minimum 1 --key-maximum 1000000 --distinct-client-seed --test-time 120 -c 25 -t 8 --pipeline 16 --hide-histogram'
  resources:
    requests:
      cpus: '8'
      memory: 2g
priority: 1
