clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: >
    --data-size 100
    --command "XADD stream:__key__ * field __data__" --command-key-pattern R --key-minimum 1 --key-maximum 100 --key-prefix "" --command-ratio 70
    --command "XREADGROUP GROUP test-group consumer1 COUNT 100 STREAMS stream:__key__ >" --command-key-pattern R --key-minimum 1 --key-maximum 100 --key-prefix "" --command-ratio 30
    --hide-histogram
    --test-time 120 -c 25 -t 4
  resources:
    requests:
      cpus: '4'
      memory: 2g
priority: 94
