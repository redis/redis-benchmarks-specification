version: 0.4
name: memtier_benchmark-100streams-xreadgroup-count-100
description: >
  Multi-stream XREADGROUP benchmark with 100 streams. Pre-loads 100 streams with
  ~100K entries each (10M seed), creates a consumer group on each. Benchmark runs
  70% XADD (producing) + 30% XREADGROUP COUNT 100 (consuming) to random streams,
  ensuring entries are always available. Tests radix-tree and keyspace lookup at
  moderate stream-count scale.
  init_commands issues one XGROUP CREATE per stream (not a single EVAL script
  looping over all 100) so each command carries its own key and routes
  correctly on a sharded/cluster deployment -- same fix as, and same bug
  class as, the 100Kstreams sibling spec (redis/redis-benchmarks-
  specification#494): a single EVAL with 0 declared keys touching 100
  different keys fails to create any consumer group under sharding.
dbconfig:
  configuration-parameters:
    save: '""'
  check:
    keyspacelen: 100
  preload_tool:
    run_image: redislabs/memtier_benchmark:edge
    tool: memtier_benchmark
    arguments: >
      "--data-size" "100"
      --command "XADD stream:__key__ * field __data__" --command-key-pattern P
      --key-minimum 1 --key-maximum 100 --key-prefix ""
      -n 50000 -c 50 -t 4 --hide-histogram
  init_commands:
    - '"XGROUP" "CREATE" "stream:1" "test-group" "0" "MKSTREAM"'
    - '"XGROUP" "CREATE" "stream:2" "test-group" "0" "MKSTREAM"'
    - '"XGROUP" "CREATE" "stream:3" "test-group" "0" "MKSTREAM"'
