version: 0.4
name: memtier_benchmark-50keys-set-10K-elements-hashtable-spop-count-9K-bounded
description: 'Runs memtier_benchmark against 50 SET keys of ~10,000 members each, issuing
  exactly one SPOP key 9000 call per key (BOUNDED via -n 50 at -c 1 -t 1). Because the
  requested count is 90% of each set (above the CASE 3 threshold: size - count = ~1,000 and
  remaining*SPOP_MOVE_STRATEGY_MUL 5 = ~5,000 <= count), spopWithCountCommand takes its CASE 3
  strategy: it extracts the ~1,000 members that STAY, builds a replacement set for them, and
  hands the popped ~9,000-member majority to the client -- the inverted-work path that the
  small-count specs never reach. Each call also propagates ~9,000 removals as SREM in batches
  capped at 1,024 elements (~9 propagation batches per call), the heaviest user of that
  batching path alongside the whole-set spec
  (memtier_benchmark-10000keys-set-100-elements-spop-whole-set-bounded). SPOP is destructive,
  and a second pop of the same key would fall onto CASE 1 (count >= the ~1,000 remaining
  members deletes the key and measures a different path), so the client is capped at exactly
  one call per set: 50 heavy calls total. This spec therefore measures per-call CASE 3 cost
  (replacement-set construction + large multi-bulk reply + batched SREM propagation) rather
  than sustained throughput; the bounded shape mirrors
  memtier_benchmark-1key-zset-1M-elements-zpopmin-bounded. PRELOAD: SADD spop90:set:__key__
  __data__ with --data-size 8 over the P pattern cycles every key exactly 10,000 times (-n
  500000 / 50 keys); random non-integer members keep the sets hashtable-encoded (far above
  set-max-intset-entries 512 and set-max-listpack-entries 128). Metric of interest: Ops/sec
  (each op is a ~9,000-element pop). SPOP large-count CASE 3 had zero benchmark coverage
  before this spec.'
dbconfig:
  configuration-parameters:
    save: '""'
  check:
    keyspacelen: 50
  resources:
    requests:
      memory: 1g
  preload_tool:
    run_image: redislabs/memtier_benchmark:edge
    tool: memtier_benchmark
    arguments: '"--data-size" "8" --command "SADD spop90:set:__key__ __data__" --command-key-pattern="P"
      --key-minimum=1 --key-maximum=50 --key-prefix "" -n 500000 -c 1 -t 1 --hide-histogram
      --pipeline 50'
  dataset_name: 50keys-set-10K-members-8B
  dataset_description: This dataset contains 50 set keys with ~10,000 members of 8 bytes each
    (hashtable-encoded).
tested-groups:
- set
tested-commands:
- spop
redis-topologies:
- oss-standalone
build-variants:
- gcc:15.2.0-amd64-debian-bookworm-default
- gcc:15.2.0-arm64-debian-bookworm-default
- dockerhub
clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: --command="SPOP spop90:set:__key__ 9000" --command-key-pattern=P --key-minimum
    1 --key-maximum 50 --key-prefix "" -n 50 -c 1 -t 1 --pipeline 1 --hide-histogram
  resources:
    requests:
      cpus: '4'
      memory: 2g
priority: 73
