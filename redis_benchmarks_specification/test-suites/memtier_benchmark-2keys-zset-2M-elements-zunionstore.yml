version: 0.4
name: memtier_benchmark-2keys-zset-2M-elements-zunionstore
description: |
  Large-scale ZUNIONSTORE: two skiplist-encoded source sorted sets of ~1.9M
  elements each (verified via ZCARD, not the nominal 2,000,000 key-range --
  see the 1key-zset-1M-elements-zadd-new-random-members sibling for the same
  double-__key__-draw shortfall), unioned into a destination of the same
  size. Total steady-state dataset across all three keys measured locally at
  ~364MB (src1 121.8MB + src2 121.8MB + dest 121.8MB) -- well inside the
  100MB-1GB band this spec exists to cover.

  This is the large-scale sibling of
  memtier_benchmark-2keys-zset-300-elements-skiplist-encoded-zunionstore
  (kept unchanged), not a replacement. That spec's whole-row total memory is
  under 1 MiB, and a freshly-started redis-server already reports roughly
  0.8-1.0MB of used_memory from its own internal structures before any data
  exists -- at that scale, most of a cross-build memory percentage is
  baseline process footprint, not ZUNIONSTORE/zset-structure cost. Here the
  payload is ~400x the baseline, so a memory delta on this spec is actually
  attributable to the command and the encoding, not the server's idle
  footprint. Encoding: skiplist+hashtable (1.9M elements per key, far past
  zset-max-listpack-entries 128 with no config override needed).

  Metric of interest: p50.00 latency. ZUNIONSTORE over two ~1.9M-element
  sets measured locally at ~3s/call (~0.3 ops/sec) -- comfortably a real,
  single-connection, non-pipelined cost, not a saturation-throughput
  workload. low-throughput-benchmark opts this spec out of the coordinator's
  1-QPS floor for exactly that reason (see the debug-reload RDB-load-time
  spec for the same opt-out and its own fleet-measured justification).
dbconfig:
  configuration-parameters:
    save: '""'
  check:
    keyspacelen: 2
  low-throughput-benchmark: 'yes'
  init_commands:
  - '"ZRANGESTORE" "src2" "src1" "0" "-1"'
  preload_tool:
    run_image: redislabs/memtier_benchmark:edge
    tool: memtier_benchmark
    arguments: --pipeline 50 --command="ZADD src1 __key__  __key__" --command-key-pattern=P
      --key-maximum 2000000 --key-prefix "" -n 200000 --hide-histogram -t 10 -c 1
  resources:
    requests:
      memory: 2g
  dataset_name: 2keys-zset-1900K-elements-skiplist
  dataset_description: |
    Two sorted set keys (src1 preloaded via memtier, src2 a server-side
    ZRANGESTORE copy of src1), each with 1,899,996 elements verified via
    ZCARD -- not the nominal 2,000,000 implied by --key-maximum, for the
    same reason documented on the 1key-zset-1M-elements sibling spec.
tested-commands:
- zunionstore
tested-groups:
- sorted-set
redis-topologies:
- oss-standalone
build-variants:
- gcc:15.2.0-amd64-debian-bookworm-default
- gcc:15.2.0-arm64-debian-bookworm-default
- dockerhub
clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: --command "ZUNIONSTORE dest 2 src1 src2" -n 20 -c 1 -t 1 --hide-histogram
  resources:
    requests:
      cpus: '2'
      memory: 4g
priority: 50
