version: 0.4
name: memtier_benchmark-1key-zset-large-members-30Kx4K-elements-zrank
description: 'Runs memtier_benchmark, for a keyspace length of 1 SORTED SET key. The SORTED
  SET contains 30,000 elements, each member a large 4096-byte string, and we query it using
  ZRANK (all hits). This is the large-member point-lookup half of the short-vs-large-member
  cost tradeoff identified by competitive analysis of ongoing large-zset representation work --
  members far above the redis/redis#15635 external-allocation threshold of 320B exercise the
  fallback / external-allocation path that used to force a whole-key skiplist fallback. Its
  short-member counterpart is memtier_benchmark-1key-zset-small-members-100K-elements-zscore-pipeline-10.
  Measures Ops/sec. This dataset contains 1 sorted set key with 30,000 elements, each member a deterministic 4096-byte string (literal filler + embedded numeric id -- not random bytes, so it is exactly reproducible by the client query) and every score a constant 0 -- a single `__key__` occurrence in the preload command (score is a literal, not a second `__key__`), so every id in the preload range is written exactly once as a member with no off-by-one gap at the range boundary. The id range (100000-129999) is fixed at a constant 6 digits so every member is exactly 4096 bytes regardless of which id it embeds -- an earlier draft started the id range at 1, which gave a variable 1-5 digit width and members 1-2 bytes short of the claimed 4096B; fixed by using a 6-digit-floor id range, the same convention as the other new specs in this PR. Exercises the fallback / external-allocation path identified by competitive analysis of ongoing large-zset representation work (members far above the redis/redis#15635 external-allocation threshold of 320B), which used to force a whole-key skiplist fallback. Encoding: skiplist+hashtable (30,000 elements, exceeds
  zset-max-listpack-entries 128, and every member exceeds zset-max-listpack-value 64B).'
dbconfig:
  configuration-parameters:
    save: '""'
  check:
    keyspacelen: 1
  preload_tool:
    run_image: redislabs/memtier_benchmark:edge
    tool: memtier_benchmark
    arguments: --key-prefix "" --command "ZADD zsetbig 0 __key__" --command-key-pattern P -n allkeys -c 1 -t 1 --hide-histogram --key-minimum 100000 --key-maximum 130000 --pipeline 20
  resources:
    requests:
      memory: 1g
  dataset_name: 1key-zset-30K-elements-large-members
  dataset_description: This dataset contains 1 sorted set key with 30,000 elements, each member a deterministic 4096-byte string (literal filler + embedded numeric id -- not random bytes, so it is exactly reproducible by the client query) and every score a constant 0 -- a single `__key__` occurrence in the preload command (score is a literal, not a second `__key__`), so every id in the preload range is written exactly once as a member with no off-by-one gap at the range boundary. The id range (100000-129999) is fixed at a constant 6 digits so every member is exactly 4096 bytes regardless of which id it embeds -- an earlier draft started the id range at 1, which gave a variable 1-5 digit width and members 1-2 bytes short of the claimed 4096B; fixed by using a 6-digit-floor id range, the same convention as the other new specs in this PR. Exercises the fallback / external-allocation path identified by competitive analysis of ongoing large-zset representation work (members far above the redis/redis#15635 external-allocation threshold of 320B), which used to force a whole-key skiplist fallback.
tested-groups:
- sorted-set
tested-commands:
- zrank
redis-topologies:
- oss-standalone
build-variants:
- gcc:15.2.0-amd64-debian-bookworm-default
- gcc:15.2.0-arm64-debian-bookworm-default
- dockerhub
clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: --key-prefix "" --command "ZRANK zsetbig __key__" --command-key-pattern P
    --key-minimum 100000 --key-maximum 130000 --hide-histogram --test-time 120 --pipeline 1
  resources:
    requests:
      cpus: '4'
      memory: 2g
priority: 18
