version: 0.4
name: memtier_benchmark-1key-800M-bits-bitmap-bitfield-pipeline-10-strings-roaring-on
description: >
  String-data variant of memtier_benchmark-1key-800M-bits-bitmap-bitfield-pipeline-10, run
  with bitmap-default-roaring yes. The preload is unchanged, so the keys start as plain
  strings, as they would on a dataset created before the config was enabled; the first
  BITFIELD write converts the string to a Roaring bitmap, so after that the run measures
  BITFIELD on a Roaring bitmap that started life as a string. Same keyspace and client
  arguments as the string spec, which runs with the config off.
dbconfig:
  configuration-parameters:
    save: '""'
    bitmap-default-roaring: 'yes'
  check:
    keyspacelen: 1
  preload_tool:
    run_image: redislabs/memtier_benchmark:edge
    tool: memtier_benchmark
    arguments: --hide-histogram -R --data-size 100000000 -n 1 -c 1 -t 1 --command
      "SET bitfield-target __data__"
  resources:
    requests:
      cpus: '2'
      memory: 2g
  dataset_name: 1key-bitmap-800Mbits-100MB-size-roaring-on
  dataset_description: This dataset contains 1 bitmap key of 100MB (800M bits) filled
    with incompressible random bytes, used as a densely packed array of small
    integers addressed by BITFIELD.
tested-commands:
- bitfield
tested-groups:
- bitmap
redis-topologies:
- oss-standalone
build-variants:
- gcc:15.2.0-amd64-debian-bookworm-default
- gcc:15.2.0-arm64-debian-bookworm-default
- dockerhub
clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: --pipeline 10 --command "BITFIELD bitfield-target INCRBY i5 __key__ 1
    GET u4 __key__ SET u8 __key__ 1" --command-key-pattern "R" --key-prefix ""
    --key-minimum 1 --key-maximum 799999900 --distinct-client-seed -c 50 -t 2
    --hide-histogram --test-time 120
  resources:
    requests:
      cpus: '2'
      memory: 2g
priority: 19
