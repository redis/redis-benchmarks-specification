version: 0.4
name: memtier_benchmark-1key-json-pass-100-get-array-of-docs-1
description: |
  Measures Ops/sec for JSON.GET of the second object of array_of_docs (`$.array_of_docs[1]`).
  pass-100 is the 229-byte document of RedisJSON's performance.docs dataset (a scalar, a sub_doc
  object and an array_of_docs array).
  Report throughput for this loaded client population (16 connections, 8 per thread x 2 threads,
  pipeline 1, 120-second measured phase); sampled response-latency percentiles describe the same load.
  The client shape is the one of the RedisJSON spec (redis-benchmark -c 16 --threads 2 -P 1); memtier
  replaces redis-benchmark so the rbs runner can drive it.
  Port of RedisJSON tests/benchmarks/json_get_array_of_docs[1]_pass_100_json.yml, whose dataset is an
  RDB file loaded by the server. The document is loaded client-side by an init command (JSON.SET of
  the exact document text at the root, so a rerun restores it), not from an RDB file, so the suite
  runs against an endpoint where files cannot be placed; it carries no exact keyspace check, so it
  also runs on a database that holds other suites' keys. The last init command issues the measured
  command once: an error reply, for example from a server whose JSONPath dialect rejects the path or
  an endpoint that does not allow the command, aborts the suite instead of reporting a throughput
  number for error replies.
  The suite needs a server with RedisJSON (Redis 8 images bundle it); the gcc source builds do not
  ship the module, so only the dockerhub build variant is declared.

dbconfig:
  configuration-parameters:
    save: '""'
  resources:
    requests:
      memory: 1g
  init_commands:
    - ['JSON.SET', 'pass-100', '$', '{"sclr":0,"str":"b","sub_doc":{"sclr":10,"str":"c","arr":[1,2,3,{"sclr":20,"str":"d"}]},"array_of_docs":[-1,{"sclr":11,"str":"e","arr":[4,5,6,{"sclr":21,"str":"f"}]},{"sclr":12,"str":"g","arr":[7,8,9,{"sclr":22,"str":"h"}]},-2]}']
    - ['JSON.GET', 'pass-100', '$.array_of_docs[1]']

tested-groups:
- json

tested-commands:
- json.get

redis-topologies:
- oss-standalone

build-variants:
- dockerhub

clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: >
    -c 8 -t 2
    --distinct-client-seed
    --pipeline=1
    --print-percentiles=50,90,95,99
    --run-count=1
    --test-time=120
    --command="JSON.GET pass-100 $.array_of_docs[1]"
    --command-key-pattern=R
    --hide-histogram
  resources:
    requests:
      cpus: '4'
      memory: 2g

priority: 150
