version: 0.4
name: memtier_benchmark-1Mkeys-string-set-grow-10B-pipeline-10
description: |
  1M-key SET insertion starting from an empty database, pipelined (`--pipeline 10`),
  every command a fresh key (`--key-pattern P:P`, keyspace swept 1..1M). Smaller-scale
  sibling of `10Mkeys-string-set-grow-10B-pipeline-10` — same growth-under-pipeline
  shape at a scale that completes in seconds, used both as a short regression gate
  for dict-rehash work and as the preload stage of the companion
  `1Mkeys-string-get-while-rehashing-pipeline-16` benchmark.
  Validates `DBSIZE == 1000000` at end (every pipelined command inserted a new key).
dbconfig:
  configuration-parameters:
    save: '""'
  check:
    keyspacelen: 1000000
  resources:
    requests:
      memory: 1g
tested-commands:
- set
tested-groups:
- string
redis-topologies:
- oss-standalone
build-variants:
- gcc:15.2.0-amd64-debian-bookworm-default
- gcc:15.2.0-arm64-debian-bookworm-default
- dockerhub
clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: '"--data-size" "10" "--ratio" "1:0" "--key-pattern" "P:P" "-c" "50" "-t" "2" "--pipeline" "10" "--hide-histogram" "--key-minimum" "1" "--key-maximum" "1000000" "-n" "allkeys"'
  resources:
    requests:
      cpus: '4'
      memory: 1g
priority: 50
