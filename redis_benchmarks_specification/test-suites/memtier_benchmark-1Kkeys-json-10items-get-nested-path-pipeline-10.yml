version: 0.4
name: memtier_benchmark-1Kkeys-json-10items-get-nested-path-pipeline-10
description: |
  Measures Ops/sec for a single nested-path JSON.GET, `$.items[3].attrs.size`, with pipeline 10:
  the pipeline shrinks the per-request networking share so the data-structure work (two array
  indexings, two object key lookups, one scalar serialisation) is a larger part of each request
  than in the pipeline-1 single-path suites.
  Every document is an object with an `items` array of 10 objects; each item has 8 scalar fields,
  a nested `attrs` object with 6 keys, a `tags` array of 3 strings and two empty placeholder objects
  `extra` and `merged`, which the write suites overwrite because RedisJSON creates new children only
  through static paths (2875 bytes per document,
  1000 documents, keys doc:1 .. doc:1000, uniform random key selection with distinct client seeds).
  Report throughput for this loaded client population (25 connections x 4 threads, pipeline 10,
  120-second measured phase); sampled response-latency percentiles describe the same load.

dbconfig:
  configuration-parameters:
    save: '""'
  check:
    keyspacelen: 1000
  resources:
    requests:
      memory: 1g
  preload_tool:
    run_image: redislabs/memtier_benchmark:edge
    tool: memtier_benchmark
    arguments: '--key-prefix "" --command "JSON.SET doc:__key__ $ \"{\\"id\\":\\"doc\\",\\"version\\":2,\\"owner\\":\\"benchmark\\",\\"items\\":[{\\"id\\":\\"item-00\\",\\"name\\":\\"Item number 0\\",\\"qty\\":1,\\"price\\":9.99,\\"active\\":true,\\"sku\\":\\"SKU00000\\",\\"vendor\\":\\"vendor-0\\",\\"rating\\":3.5,\\"attrs\\":{\\"color\\":\\"red\\",\\"size\\":\\"S\\",\\"weight\\":0.5,\\"material\\":\\"cotton\\",\\"origin\\":\\"PT\\",\\"warranty\\":\\"2y\\"},\\"tags\\":[\\"new\\",\\"sale\\",\\"featured\\"],\\"extra\\":{},\\"merged\\":{}},{\\"id\\":\\"item-01\\",\\"name\\":\\"Item number 1\\",\\"qty\\":2,\\"price\\":11.49,\\"active\\":false,\\"sku\\":\\"SKU00001\\",\\"vendor\\":\\"vendor-1\\",\\"rating\\":3.6,\\"attrs\\":{\\"color\\":\\"green\\",\\"size\\":\\"M\\",\\"weight\\":0.75,\\"material\\":\\"cotton\\",\\"origin\\":\\"PT\\",\\"warranty\\":\\"2y\\"},\\"tags\\":[\\"new\\",\\"sale\\",\\"featured\\"],\\"extra\\":{},\\"merged\\":{}},{\\"id\\":\\"item-02\\",\\"name\\":\\"Item number 2\\",\\"qty\\":3,\\"price\\":12.99,\\"active\\":true,\\"sku\\":\\"SKU00002\\",\\"vendor\\":\\"vendor-2\\",\\"rating\\":3.7,\\"attrs\\":{\\"color\\":\\"blue\\",\\"size\\":\\"L\\",\\"weight\\":1.0,\\"material\\":\\"cotton\\",\\"origin\\":\\"PT\\",\\"warranty\\":\\"2y\\"},\\"tags\\":[\\"new\\",\\"sale\\",\\"featured\\"],\\"extra\\":{},\\"merged\\":{}},{\\"id\\":\\"item-03\\",\\"name\\":\\"Item number 3\\",\\"qty\\":4,\\"price\\":14.49,\\"active\\":false,\\"sku\\":\\"SKU00003\\",\\"vendor\\":\\"vendor-0\\",\\"rating\\":3.8,\\"attrs\\":{\\"color\\":\\"red\\",\\"size\\":\\"XL\\",\\"weight\\":1.25,\\"material\\":\\"cotton\\",\\"origin\\":\\"PT\\",\\"warranty\\":\\"2y\\"},\\"tags\\":[\\"new\\",\\"sale\\",\\"featured\\"],\\"extra\\":{},\\"merged\\":{}},{\\"id\\":\\"item-04\\",\\"name\\":\\"Item number 4\\",\\"qty\\":5,\\"price\\":15.99,\\"active\\":true,\\"sku\\":\\"SKU00004\\",\\"vendor\\":\\"vendor-1\\",\\"rating\\":3.9,\\"attrs\\":{\\"color\\":\\"green\\",\\"size\\":\\"S\\",\\"weight\\":1.5,\\"material\\":\\"cotton\\",\\"origin\\":\\"PT\\",\\"warranty\\":\\"2y\\"},\\"tags\\":[\\"new\\",\\"sale\\",\\"featured\\"],\\"extra\\":{},\\"merged\\":{}},{\\"id\\":\\"item-05\\",\\"name\\":\\"Item number 5\\",\\"qty\\":6,\\"price\\":17.49,\\"active\\":false,\\"sku\\":\\"SKU00005\\",\\"vendor\\":\\"vendor-2\\",\\"rating\\":4.0,\\"attrs\\":{\\"color\\":\\"blue\\",\\"size\\":\\"M\\",\\"weight\\":1.75,\\"material\\":\\"cotton\\",\\"origin\\":\\"PT\\",\\"warranty\\":\\"2y\\"},\\"tags\\":[\\"new\\",\\"sale\\",\\"featured\\"],\\"extra\\":{},\\"merged\\":{}},{\\"id\\":\\"item-06\\",\\"name\\":\\"Item number 6\\",\\"qty\\":7,\\"price\\":18.99,\\"active\\":true,\\"sku\\":\\"SKU00006\\",\\"vendor\\":\\"vendor-0\\",\\"rating\\":4.1,\\"attrs\\":{\\"color\\":\\"red\\",\\"size\\":\\"L\\",\\"weight\\":2.0,\\"material\\":\\"cotton\\",\\"origin\\":\\"PT\\",\\"warranty\\":\\"2y\\"},\\"tags\\":[\\"new\\",\\"sale\\",\\"featured\\"],\\"extra\\":{},\\"merged\\":{}},{\\"id\\":\\"item-07\\",\\"name\\":\\"Item number 7\\",\\"qty\\":8,\\"price\\":20.49,\\"active\\":false,\\"sku\\":\\"SKU00007\\",\\"vendor\\":\\"vendor-1\\",\\"rating\\":4.2,\\"attrs\\":{\\"color\\":\\"green\\",\\"size\\":\\"XL\\",\\"weight\\":2.25,\\"material\\":\\"cotton\\",\\"origin\\":\\"PT\\",\\"warranty\\":\\"2y\\"},\\"tags\\":[\\"new\\",\\"sale\\",\\"featured\\"],\\"extra\\":{},\\"merged\\":{}},{\\"id\\":\\"item-08\\",\\"name\\":\\"Item number 8\\",\\"qty\\":9,\\"price\\":21.99,\\"active\\":true,\\"sku\\":\\"SKU00008\\",\\"vendor\\":\\"vendor-2\\",\\"rating\\":4.3,\\"attrs\\":{\\"color\\":\\"blue\\",\\"size\\":\\"S\\",\\"weight\\":2.5,\\"material\\":\\"cotton\\",\\"origin\\":\\"PT\\",\\"warranty\\":\\"2y\\"},\\"tags\\":[\\"new\\",\\"sale\\",\\"featured\\"],\\"extra\\":{},\\"merged\\":{}},{\\"id\\":\\"item-09\\",\\"name\\":\\"Item number 9\\",\\"qty\\":10,\\"price\\":23.49,\\"active\\":false,\\"sku\\":\\"SKU00009\\",\\"vendor\\":\\"vendor-0\\",\\"rating\\":4.4,\\"attrs\\":{\\"color\\":\\"red\\",\\"size\\":\\"M\\",\\"weight\\":2.75,\\"material\\":\\"cotton\\",\\"origin\\":\\"PT\\",\\"warranty\\":\\"2y\\"},\\"tags\\":[\\"new\\",\\"sale\\",\\"featured\\"],\\"extra\\":{},\\"merged\\":{}}]}\""
      --command-key-pattern="P" --key-minimum=1 --key-maximum=1001 -n allkeys
      -c 1 -t 1 --hide-histogram --pipeline 50'
  dataset_name: 1Kkeys-json-10items-2875B
  dataset_description: 1000 JSON documents (doc:1 .. doc:1000) of 2875 bytes each, every document an object with an items array of 10 objects, each item having 8 scalar fields, a nested attrs object with 6 keys, a tags array of 3 strings, and two empty placeholder objects (extra, merged) that the write suites overwrite, since RedisJSON only creates new children through static paths.

tested-groups:
- json

tested-commands:
- json.get

redis-topologies:
- oss-standalone

build-variants:
- gcc:15.2.0-amd64-debian-bookworm-default
- gcc:15.2.0-arm64-debian-bookworm-default
- dockerhub

clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: >
    -c 25 -t 4
    --key-prefix ""
    --key-minimum 1
    --key-maximum 1000
    --distinct-client-seed
    --pipeline=10
    --print-percentiles=50,90,95,99
    --run-count=1
    --test-time=120
    --command="JSON.GET doc:__key__ $.items[3].attrs.size"
    --command-key-pattern=R
    --hide-histogram
  resources:
    requests:
      cpus: '4'
      memory: 2g

priority: 150
