  dataset_name: 1key-zset-128-elements-lex-integers
  dataset_description: This dataset contains 1 sorted set key with 128 integer members, 0 to 127, all with score 0.
tested-groups:
- sorted-set
tested-commands:
- zlexcount
redis-topologies:
- oss-standalone
build-variants:
- gcc:15.2.0-amd64-debian-bookworm-default
- gcc:15.2.0-arm64-debian-bookworm-default
- dockerhub
clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: '--command "ZLEXCOUNT zset:lexint:128 - +" --hide-histogram --test-time 120 -c 25 -t 8 --pipeline 16'
  resources:
    requests:
      cpus: '8'
      memory: 2g
priority: 1
