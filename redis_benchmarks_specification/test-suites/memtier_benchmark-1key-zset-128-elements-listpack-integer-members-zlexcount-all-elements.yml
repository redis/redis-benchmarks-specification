version: 0.4
name: memtier_benchmark-1key-zset-128-elements-listpack-integer-members-zlexcount-all-elements
description: 'Runs memtier_benchmark against 1 SORTED SET key with 128 members, all with score 0, so lex ranges apply. Encoding: listpack (128 members, at the zset-max-listpack-entries limit; members are integers 0 to 127, stored as listpack integers). ZLEXCOUNT over the whole set (- +) where every member is stored as a listpack integer, so each bound check has to turn the integer into its decimal string before comparing. Metric of interest: Ops/sec. The command is read-only, so the set never changes during the run.'
dbconfig:
  configuration-parameters:
    save: '""'
  check:
    keyspacelen: 1
  resources:
    requests:
      memory: 1g
  init_commands:
