version: 0.4
name: memtier_benchmark-1Mkeys-string-delex-ifdne-integer
description: |
  Measures Ops/sec of the conditional DELEX ... IFDNE <digest> path in
  delexCommand() (src/db.c) on an integer-encoded value (OBJ_ENCODING_INT,
  value 12345, above the shared-integer range). The XXH3 digest of 12345 is
  f34099ede96b5581, so the condition never holds and no key is deleted: the keyspace
  does not drain. Each call formats the integer and computes its digest before
  comparing. Pipeline 16 to make per-command overhead visible.
dbconfig:
  configuration-parameters:
    save: '""'
  check:
    keyspacelen: 1000000
  preload_tool:
    run_image: redislabs/memtier_benchmark:edge
    tool: memtier_benchmark
    arguments: '--command "SET __key__ 12345" --command-key-pattern P --key-minimum 1 --key-maximum 1000000 -n allkeys -c 50 -t 2 --pipeline 50 --hide-histogram'
  resources:
    requests:
      memory: 1g
  dataset_name: 1Mkeys-string-integer-12345
  dataset_description: 1 million string keys, each holding the integer 12345 (OBJ_ENCODING_INT).
tested-commands:
- delex
tested-groups:
- string
redis-topologies:
- oss-standalone
build-variants:
- gcc:15.2.0-amd64-debian-bookworm-default
- gcc:15.2.0-arm64-debian-bookworm-default
- dockerhub
clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: '--command "DELEX __key__ IFDNE f34099ede96b5581" --command-key-pattern R --key-minimum 1 --key-maximum 1000000 --distinct-client-seed --test-time 120 -c 50 -t 4 --pipeline 16 --hide-histogram'
  resources:
    requests:
      cpus: '4'
      memory: 2g
priority: 1
