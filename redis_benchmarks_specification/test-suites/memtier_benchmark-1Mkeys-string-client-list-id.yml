version: 0.4
name: memtier_benchmark-1Mkeys-string-client-list-id
description: Measures throughput of CLIENT LIST ID <id> with a single random id per call. This isolates the id-filter WALK cost of CLIENT LIST - the full client list (~1000 sustained connections from -c 250 -t 4) is traversed and each client id is checked against the requested id set - while serializing at most one matched client (catClientInfoString) per call. It therefore complements, rather than overlaps, the full CLIENT LIST test (which measures bulk serialization of all clients) and the CLIENT KILL ADDR no-match test. The single id is injected via memtier's __key__ substitution with --key-prefix "" and a random pattern (--command-key-pattern R) over --key-minimum 1 --key-maximum 2000; that range comfortably spans the active-connection id window (Redis assigns ids monotonically, so the benchmark's connections land in ~[130,1130] after the small preload offset), so a large fraction of calls hit a live client, and calls that miss still exercise the same full walk. Preloads 1M keys to simulate a realistic server state.
dbconfig:
  configuration-parameters:
    save: '""'
  check:
    keyspacelen: 1000000
  preload_tool:
    run_image: redislabs/memtier_benchmark:edge
    tool: memtier_benchmark
    arguments: '"--data-size" "10" "--ratio" "1:0" "--key-pattern" "P:P" "-c" "50" "-t" "2" "--hide-histogram" "--key-minimum" "1" "--key-maximum" "1000000" "-n" "allkeys" --pipeline 50'
  resources:
    requests:
      memory: 1g
  dataset_name: 1Mkeys-string-10B-size
  dataset_description: This dataset contains 1 million string keys, each with a data size of 10 bytes.
tested-commands:
- client
tested-groups:
- connection
redis-topologies:
- oss-standalone
build-variants:
- gcc:15.2.0-amd64-debian-bookworm-default
- gcc:15.2.0-arm64-debian-bookworm-default
- dockerhub
clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: --command "CLIENT LIST ID __key__" --command-key-pattern R --key-minimum 1 --key-maximum 2000 --key-prefix "" -c 250 -t 4 --hide-histogram --test-time 120
  resources:
    requests:
      cpus: '4'
      memory: 2g
priority: 50
