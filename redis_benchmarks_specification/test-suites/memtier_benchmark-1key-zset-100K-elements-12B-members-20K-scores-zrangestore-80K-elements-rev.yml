# dataset_name 1key-zset-100K-elements-12B-members-20K-scores: the dataset load is shared verbatim by every spec
# that uses this dataset.
version: 0.4
name: memtier_benchmark-1key-zset-100K-elements-12B-members-20K-scores-zrangestore-80K-elements-rev
description: 'Runs ZRANGESTORE zset1 zs:100K 10000 89999 REV: a reverse rank range of 80,000 of 100,000 members (80,000 results). Per call the server resolves the range, stores the result into the destination and frees the previous destination synchronously (lazyfree-lazy-server-del pinned to no). Metric of interest: server-side usec_per_call of the measured command (INFO commandstats, reset by the harness before the dataset load; the load calls neither ZRANDMEMBER nor ZRANGESTORE); client Ops/sec is secondary. Dataset: 1 sorted set zs:100K: 100,000 members m:%010d (12 bytes each), integer score (i-1) mod 20000 (20,000 distinct scores, 5 members per score). Encoding: btree on unstable, skiplist on 8.10.x and older (above zset-max-listpack-entries 128). Load: 1 x 1 connection, pipeline 1, 120 s. Read-only on the source, so no keyspace drain; the destination key is not counted by keyspacelen.'
dbconfig:
  configuration-parameters:
    save: '""'
    lazyfree-lazy-server-del: 'no'
  check:
    keyspacelen: 1
  resources:
    requests:
      memory: 1g
  init_lua: |
    -- zs:100K: 100,000 members 'm:%010d' (exactly 12 bytes) with integer score (i-1) % 20000, so exactly 20,000 distinct scores holding 5 members each. Inserted in i order: the first pass over the scores is a sorted append, later passes insert into existing score runs.
    -- Deterministic (no RNG). ZADD in batches of 1000 args (500 members). Checks ZCARD, the
    -- score layout and OBJECT ENCODING; on a mismatch it returns an error reply, otherwise
    -- it returns ZCARD (the runner logs it as 'Lua script result: <N>', GATE rule 1).
    local key = 'zs:100K'
    local n = 100000
    local args = {}
    for j = 0, n - 1 do
      local i = j + 1
      args[#args + 1] = (i - 1) % 20000
      args[#args + 1] = string.format('m:%010d', i)
      if #args == 1000 then
        redis.call('ZADD', key, unpack(args))
        args = {}
      end
    end
    if #args > 0 then redis.call('ZADD', key, unpack(args)) end
    local card = redis.call('ZCARD', key)
    local enc = redis.call('OBJECT', 'ENCODING', key)
    if card ~= n or enc == 'listpack' or enc == 'ziplist' then
      return redis.error_reply('preload failed: ZCARD=' .. card .. ' encoding=' .. enc)
    end
    local first = redis.call('ZRANGE', key, 0, 0, 'WITHSCORES')
    local last = redis.call('ZRANGE', key, -1, -1, 'WITHSCORES')
    local per = redis.call('ZCOUNT', key, 7, 7)
    if tonumber(first[2]) ~= 0 or tonumber(last[2]) ~= 19999 or per ~= 5 then
      return redis.error_reply('preload failed: min=' .. tostring(first[2]) .. ' max=' ..
        tostring(last[2]) .. ' per-score=' .. per)
    end
    return card
  dataset_name: 1key-zset-100K-elements-12B-members-20K-scores
  dataset_description: '1 sorted set zs:100K: 100,000 members m:%010d (12 bytes each), integer score (i-1) mod 20000 (20,000 distinct scores, 5 members per score).'
tested-groups:
- sorted-set
tested-commands:
- zrangestore
redis-topologies:
- oss-standalone
build-variants:
- gcc:15.2.0-amd64-debian-bookworm-default
- gcc:15.2.0-arm64-debian-bookworm-default
- dockerhub
clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: --command="ZRANGESTORE zset1 zs:100K 10000 89999 REV" --hide-histogram --test-time 120 --pipeline 1 -c 1 -t 1
  resources:
    requests:
      cpus: '2'
      memory: 2g
priority: 12
