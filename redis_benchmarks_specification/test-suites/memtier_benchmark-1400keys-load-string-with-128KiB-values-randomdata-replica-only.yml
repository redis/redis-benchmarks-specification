version: 0.4
name: memtier_benchmark-1400keys-load-string-with-128KiB-values-randomdata-replica-only
description: |
  Replication full-sync benchmark, value-heavy shape: 1400 keys with 128KiB
  random (incompressible) values (~183 MB dataset) — reproduces the exact
  dataset shape from redis/redis#15732's own reported benchmark ("Value-heavy:
  1400 x 128KB strings, 183MB, warm cache", -24.6% RDB load time). The metric
  of interest is the time the coordinator records for "replication link is
  up" — this is the end-to-end full sync time.

  Random (-R) values are deliberate: memtier's default data pattern is
  highly LZF-compressible, which shrinks the on-wire/checksummed byte count
  well below the nominal value size and lets LZF decompression dominate
  replica-side CPU instead of checksumming — exactly the effect that made
  the sibling 20Mkeys-1KiB-values-replica-only spec measure ~0% effect for
  #15732 (profiled: crc64 ~0.12% of replica CPU there, lzf_decompress 62%).
  Large, incompressible values are the one shape where a faster crc64()
  can actually show up end-to-end: enough raw bytes per value that checksum
  cost is no longer negligible (Amdahl), and no compression competing for
  the same CPU budget.

  Steady-state benchmark is intentionally short (30s) — the point of this
  test is the SYNC time during topology setup, not the steady-state ops/sec.
dbconfig:
  # Run preload BEFORE replicas spin up so the master->replica full sync
  # transfers the whole dataset (rather than syncing an empty primary and
  # propagating writes via the replication stream).
  preload_before_replica: true
  configuration-parameters:
    save: '""'
    maxmemory-policy: noeviction
  check:
    keyspacelen: 1400
  preload_tool:
    run_image: redislabs/memtier_benchmark:edge
    tool: memtier_benchmark
    arguments: --data-size 131072 -R --ratio 1:0 -n allkeys --pipeline 50 --key-maximum
      1400 --key-pattern P:P --key-minimum 1 --hide-histogram -t 8 -c 25
  resources:
    requests:
      memory: 2g
  dataset_name: 1400keys-string-128KiB-size-randomdata
  dataset_description: |
    1400 string keys, each with a 131072-byte (128KiB) random incompressible
    value (~183 MB dataset) — same shape as redis/redis#15732's own
    "value-heavy" benchmark cell.
tested-commands:
- set
redis-topologies:
- oss-standalone-01-replicas
build-variants:
- gcc:15.2.0-amd64-debian-bookworm-default
- gcc:15.2.0-arm64-debian-bookworm-default
- dockerhub
clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: '"--data-size" "131072" --pipeline 10 --distinct-client-seed --ratio
    0:1 --key-pattern R:R --key-minimum=1 --key-maximum 1400 --test-time 30 -c 20
    -t 4 --hide-histogram'
  resources:
    requests:
      cpus: '4'
      memory: 1g
tested-groups:
- string
exporter:
  redistimeseries:
    metrics:
    - $."ALL STATS".Totals.ReplicationFullSyncSeconds
    - $."ALL STATS".Totals.ReplicationFullSyncCountDuringBench
priority: 17
