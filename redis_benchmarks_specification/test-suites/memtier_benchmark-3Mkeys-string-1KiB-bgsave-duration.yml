version: 0.4
name: memtier_benchmark-3Mkeys-string-1KiB-bgsave-duration
description: |
  Standalone BGSAVE-duration benchmark: preloads 3M string keys with
  1024-byte compressible values (~3.75GB resident, memtier's default
  data pattern -- not -R random bytes -- so LZF actually does real
  compression work; measured locally at 115MB on disk, ~32x), then
  issues a single explicit BGSAVE and times it via Redis's own INFO
  persistence fields (rdb_last_bgsave_time_sec, latest_fork_usec), not
  client-observed latency.

  Measured directly against this exact dataset shape (local build, one
  BGSAVE timed by polling rdb_bgsave_in_progress): ~5.6s wall-clock,
  rdb_last_bgsave_time_sec=5. That is meaningfully faster than an
  earlier "tens of seconds" estimate carried over from the
  incompressible/under-write-pressure 3Mkeys-set sibling -- this spec
  removes both compression and write pressure, so most of what's left
  is LZF CPU over a dataset that compresses ~32x, not disk I/O. At ~5s,
  rdb_last_bgsave_time_sec's whole-second resolution is a real ~20%
  single-run quantization, not the few-percent this description
  originally (incorrectly) claimed. That resolution is still adequate
  for the class of BGSAVE regression this spec was built to validate --
  a reported lzf_compress cache-line-alignment sensitivity in the
  ~20-33% range, well above the per-sample noise floor -- and the
  standard n>=3 fleet trigger practice averages the quantization down
  further, but a future investigation needing single-digit-percent
  resolution would need either a scaled-up dataset (proportionally
  larger than this one) or a coordinator-side sub-second timer instead
  of relying on rdb_last_bgsave_time_sec alone. (The specific fix that
  prompted this spec lives in an internal repo, not linkable from here;
  tracked in this workspace's own approach notes.)

  Built to give a clean, write-quiescent BGSAVE duration number --
  distinct from the existing 3Mkeys-set family, which intentionally
  times fork/CoW cost *under* sustained write pressure (a different,
  harder-to-isolate signal). Here there is no concurrent write traffic
  during the measured BGSAVE, so the number reflects pure save-path
  cost: fork + RDB serialization + LZF compression + disk write, with
  no page-dirtying/CoW noise superimposed.

  BGSAVE forks and replies "Background saving started" immediately --
  client-observed latency is fork time, not save time (confirmed
  directly: 4.1ms client-side against a real ~1s save). dbconfig.wait_for_bgsave
  makes the coordinator poll INFO persistence's rdb_bgsave_in_progress
  after the client run finishes, blocking until the save Redis is
  actually running completes, then confirms a save genuinely happened
  in that window (rdb_last_save_time strictly advanced past a pre-run
  snapshot AND rdb_last_bgsave_status is ok -- rdb_bgsave_in_progress==0
  alone doesn't prove a save ran; a fresh/never-saved server reads 0
  too) before injecting RdbLastBgsaveTimeSec (whole seconds -- Redis's
  own resolution) and RdbLastForkUsec (microseconds, from INFO's
  *stats* section) into the exported metrics. If that confirmation
  fails (timeout, or no save detected), nothing is injected rather than
  exporting a stale or sentinel (-1) value. (The coordinator's own
  poll-loop timer has finer, 200ms resolution than Redis's whole-second
  field, but is not exported: the poll only starts after container
  teardown -- topdown/profiler stop, results parsing -- which can
  easily outlast a write-quiescent BGSAVE, so it would measure
  coordinator teardown latency more than BGSAVE itself.)

  save is pinned to "" so periodic autosave never fires -- the only
  BGSAVE in the measured window is the one this spec explicitly issues.
  rdbcompression is left at its default (yes) so LZF actually runs,
  unlike the crc64-isolation specs (140Kkeys/1400keys-...-randomdata-...)
  which deliberately disable it. Values use memtier's default data
  pattern (not -R random bytes), which is the highly-compressible
  extreme, not a "representative" middle ground; -R would be the
  incompressible extreme instead. This spec deliberately sits at the
  compressible end since that is where lzf_compress's own cost is
  largest and most visible -- confirmed directly: the resulting RDB
  measured 115MB on disk against a 3.75GB resident dataset (~32x),
  so LZF is doing real, substantial work rather than a few bytes of
  no-op compression attempts.
dbconfig:
  configuration-parameters:
    save: '""'
    maxmemory-policy: noeviction
  check:
    keyspacelen: 3000000
  preload_tool:
    run_image: redislabs/memtier_benchmark:edge
    tool: memtier_benchmark
    arguments: --data-size 1024 --ratio 1:0 -n allkeys --pipeline 50 --key-maximum
      3000000 --key-pattern P:P --key-minimum 1 --hide-histogram -t 8 -c 25
  resources:
    requests:
      memory: 6g
  dataset_name: 3Mkeys-string-1KiB-size-compressible
  dataset_description: |
    3 million string keys, each with a 1024-byte compressible value
    (memtier's default data pattern, not -R random bytes -- the
    highly-compressible extreme, not a realistic middle ground) --
    ~3.75GB resident (measured), compressing to ~115MB on disk (~32x).
    Measured BGSAVE duration on this exact shape is ~5-6s, sized to be
    a measurable, meaningful save-path cost dominated by LZF CPU
    rather than disk I/O.
  wait_for_bgsave: true
tested-commands:
- bgsave
redis-topologies:
- oss-standalone
build-variants:
- gcc:15.2.0-amd64-debian-bookworm-default
- gcc:15.2.0-arm64-debian-bookworm-default
- dockerhub
clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: --command "BGSAVE" --command-key-pattern="R" -n 1 -c 1 -t 1 --hide-histogram
  resources:
    requests:
      cpus: '2'
      memory: 1g
tested-groups:
- server
exporter:
  redistimeseries:
    # merge_default_and_config_metrics() EXTENDS defaults.yml rather than
    # replacing it, so the standard Ops/sec / Latency / p50.00 / p99.00
    # series also get pushed under this test name, off the single ~4ms
    # BGSAVE fork-ack reply -- harmless (arguably a second read on fork-ack
    # latency), but don't mistake that p50.00 for save duration; the
    # metrics below are the actual save-duration numbers.
    metrics:
    - $."ALL STATS".Totals.RdbLastBgsaveTimeSec
    - $."ALL STATS".Totals.RdbLastForkUsec
priority: 50
