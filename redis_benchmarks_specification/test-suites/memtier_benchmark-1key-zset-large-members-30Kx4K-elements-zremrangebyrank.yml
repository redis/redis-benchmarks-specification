version: 0.4
name: memtier_benchmark-1key-zset-large-members-30Kx4K-elements-zremrangebyrank
description: 'Runs memtier_benchmark, for a keyspace length of 1 SORTED SET key. The SORTED
  SET contains 30,000 elements, each member a large 4096-byte string, and we measure the
  per-call latency of ZREMRANGEBYRANK bulk-deleting 30 elements at a time (rank 0..29) --
  the "large deletions" headline win path identified by competitive analysis of ongoing
  large-zset representation work. The run is bounded to exactly 1000 calls (1000 * 30 =
  30,000 == the full preloaded corpus) so the corpus is consumed exactly once with no
  leftover empty-range no-op calls (the keyspace-drain anti-pattern): this is a bounded,
  single-pass bulk-deletion latency probe, not an open-ended steady-state throughput
  spec (a --test-time design here would either drain to empty mid-run and start measuring
  cheap no-ops, or need a same-invocation refill stream, which memtier''s CLI rejects when
  mixing a keyless command with a keyed one in one invocation -- verified empirically, RC=2 on
  every combination tried). Measures p50/p99 latency. Encoding: skiplist+hashtable (30,000
  elements, exceeds zset-max-listpack-entries 128, and every member exceeds
  zset-max-listpack-value 64B).'
dbconfig:
  configuration-parameters:
    save: '""'
  check:
    keyspacelen: 1
  preload_tool:
    run_image: redislabs/memtier_benchmark:edge
    tool: memtier_benchmark
    arguments: --key-prefix "" --command "ZADD zsetbig 0 __key__" --command-key-pattern P -n allkeys -c 1 -t 1 --hide-histogram --key-minimum 100000 --key-maximum 130000 --pipeline 20
  resources:
    requests:
      memory: 1g
  dataset_name: 1key-zset-30K-elements-large-members
  dataset_description: This dataset contains 1 sorted set key with 30,000 elements (ids
    100000-129999), each member a deterministic 4096-byte string (literal filler + a
    constant-6-digit embedded numeric id, so every member is exactly 4096 bytes) and every
    score a constant 0.
tested-groups:
- sorted-set
tested-commands:
- zremrangebyrank
redis-topologies:
- oss-standalone
build-variants:
- gcc:15.2.0-amd64-debian-bookworm-default
- gcc:15.2.0-arm64-debian-bookworm-default
- dockerhub
clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: --command "ZREMRANGEBYRANK zsetbig 0 29" -n 1000 --hide-histogram --pipeline 1
    -c 1 -t 1
  resources:
    requests:
      cpus: '4'
      memory: 2g
priority: 8
