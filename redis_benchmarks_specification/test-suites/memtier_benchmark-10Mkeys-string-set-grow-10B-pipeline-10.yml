version: 0.4
name: memtier_benchmark-10Mkeys-string-set-grow-10B-pipeline-10
description: |
  10M-key SET insertion starting from an empty database, pipelined (`--pipeline 10`),
  with every command a fresh key (`--key-pattern P:P`, keyspace swept 1..10M). Forces
  many dict-rehash cycles while the client stays coalesced, so tail latency on
  SET is dominated by rehash cost rather than RTT. Pipelined sibling of
  `10Mkeys-string-set-grow-10B` — the unpipelined baseline measures per-request
  RTT; this one exposes rehash-driven stalls inside the server loop.
  Validates `DBSIZE == 10000000` at end (every pipelined command inserted a new key,
  no overwrites).
dbconfig:
  configuration-parameters:
    save: '""'
  check:
    keyspacelen: 10000000
  resources:
    requests:
      memory: 2g
tested-commands:
- set
tested-groups:
- string
redis-topologies:
- oss-standalone
build-variants:
- gcc:15.2.0-amd64-debian-bookworm-default
- gcc:15.2.0-arm64-debian-bookworm-default
- dockerhub
clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: '"--data-size" "10" "--ratio" "1:0" "--key-pattern" "P:P" "-c" "50" "-t" "2" "--pipeline" "10" "--hide-histogram" "--key-minimum" "1" "--key-maximum" "10000000" "-n" "allkeys"'
  resources:
    requests:
      cpus: '4'
      memory: 2g
priority: 50
