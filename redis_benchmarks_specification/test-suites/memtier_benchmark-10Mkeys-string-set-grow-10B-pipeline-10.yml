version: 0.4
name: memtier_benchmark-10Mkeys-string-set-grow-10B-pipeline-10
description: |-
  Measures Ops/sec for 10M SET insertions starting from an empty database.
  Values are ten-byte EMBSTR strings. The 100 clients use disjoint P:P key
  ranges and pipeline 10, with a fixed request count covering every key once.
  Growing the keyspace exercises dictionary allocation and rehash alongside
  normal SET work. Throughput covers the whole growth epoch; pipelined response
  latency includes queueing and does not isolate rehash cost. Initialization
  requires an empty database, and postrun_lua rejects the result unless DBSIZE
  is exactly 10000000.
dbconfig:
  configuration-parameters:
    save: '""'
  check:
    keyspacelen: 0
  resources:
    requests:
      memory: 2g
  init_commands:
  - - EVAL
    - assert(redis.call('DBSIZE') == 0, 'growth workload requires an empty database') return 1
    - 0
  postrun_lua: |-
    assert(redis.call('DBSIZE') == 10000000, 'incomplete SET growth workload')
    return 1
tested-commands:
- set
tested-groups:
- string
redis-topologies:
- oss-standalone
build-variants:
- gcc:15.2.0-amd64-debian-bookworm-default
- gcc:15.2.0-arm64-debian-bookworm-default
- dockerhub
clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: '"--data-size" "10" "--ratio" "1:0" "--key-pattern" "P:P" "-c" "50" "-t" "2" "--pipeline"
    "10" "--hide-histogram" "--key-minimum" "1" "--key-maximum" "10000000" "-n" "allkeys"'
  resources:
    requests:
      cpus: '4'
      memory: 2g
priority: 50
