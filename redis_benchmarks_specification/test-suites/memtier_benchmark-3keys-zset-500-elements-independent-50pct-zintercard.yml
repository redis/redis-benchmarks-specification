version: 0.4
name: memtier_benchmark-3keys-zset-500-elements-independent-50pct-zintercard
description: 'Runs memtier_benchmark issuing ZINTERCARD over 3 sorted sets of 490, 500 and 510
  elements (ov:1, ov:2, ov:3), each drawn from a common universe m:1..m:1000 (3-5 byte members).
  Each key independently holds its own pseudo-random subset of the 1000 (deterministic, a different
  seed per key), so each candidate is in any other key with probability ~50% regardless of what
  earlier keys held. The sizes are strictly increasing so the iteration and probe order is fixed
  (ov:1, ov:2, ov:3) and does not depend on sort tie-breaking. The existing intersect suites make
  every key identical, so every lookup hits; here each lookup''s hit/miss outcome is close to a coin
  flip and does not follow a regular pattern. The reply is a constant 121 (seeded, so fixed). It
  covers numkeys=3, between the existing 2-key and 8-key suites. Encoding: skiplist through 8.10.x,
  btree (OBJ_ENCODING_BTREE) from 8.12 (490-510 elements per input, above zset-max-listpack-entries
  128). Load: memtier defaults (4 threads x 50 clients, pipeline 1), the same as the existing
  ZINTER/ZINTERCARD suites so results line up with them. Unlike the existing 2-key and 8-key
  ZINTERCARD suites, which preload 64 keys, this suite preloads only the 3 keys it queries. Metric
  of interest: Ops/sec.'
dbconfig:
  configuration-parameters:
    save: '""'
  check:
    keyspacelen: 3
  resources:
    requests:
      memory: 1g
  init_lua: |
    -- Universe m:1..m:1000. Key k independently takes the first size[k] entries
    -- of a Fisher-Yates shuffle driven by its own MINSTD generator with a per-key
    -- seed, so membership in one key carries no information about membership in
    -- another (each ~50%). Sizes 490 < 500 < 510 fix the by-cardinality order.
    -- Score = universe index.
    local size = {490, 500, 510}
    for k = 1, 3 do
      local u = {}
      for i = 1, 1000 do u[i] = i end
      local x = 12345 + k * 7919
      for i = 1000, 2, -1 do
        x = (x * 48271) % 2147483647
        local j = (x % i) + 1
        u[i], u[j] = u[j], u[i]
      end
      for i = 1, size[k] do
        redis.call('ZADD', 'ov:' .. k, u[i], 'm:' .. u[i])
      end
    end
    return 1
  dataset_name: 3keys-sorted-set-490-500-510-elements-independent-50pct-membership
  dataset_description: 3 sorted sets ov:1..ov:3 of 490, 500 and 510 members, each an independent
    pseudo-random subset of m:1..m:1000. 3-way intersection = 121.
tested-commands:
- zintercard
redis-topologies:
- oss-standalone
build-variants:
- gcc:15.2.0-amd64-debian-bookworm-default
- gcc:15.2.0-arm64-debian-bookworm-default
- dockerhub
clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: --command="ZINTERCARD 3 ov:1 ov:2 ov:3 LIMIT 0"  --hide-histogram --test-time 120
  resources:
    requests:
      cpus: '4'
      memory: 2g
tested-groups:
- sorted-set
priority: 131
