version: 0.4
name: memtier_benchmark-1key-list-500K-elements-lmpop-8keys-bounded
description: 'Runs memtier_benchmark issuing LMPOP with numkeys=8 against a single populated list of 500,000 elements, using a BOUNDED number of calls. LMPOP has no coverage today. Only the LAST of the 8 key names is populated, which is the point: LMPOP scans the provided keys in order and stops at the first non-empty one, so populating the last key forces all 8 lookups on every call and exercises the numkeys fan-out rather than a single hit. PRELOAD DOMAIN: the LPUSH preload runs -n 50000 across -t 10 threads with one element per command, giving 500,000 elements (verified via LLEN). The client is bounded to -n 100000 at -c 1 -t 1, i.e. exactly 100,000 pops - 20% of the preload - so the list cannot drain and the suite cannot degenerate into measuring the empty-list reply. Encoding: quicklist (500,000 elements, exceeds list-max-listpack-size). Metric of interest: Ops/sec.'
dbconfig:
  configuration-parameters:
    save: '""'
  check:
    keyspacelen: 1
  preload_tool:
    run_image: redislabs/memtier_benchmark:edge
    tool: memtier_benchmark
    arguments: --pipeline 50 --command="LPUSH lmpop:key:8 __key__" --command-key-pattern=P --key-minimum 1 --key-maximum 500000 --key-prefix "" -n 50000 --hide-histogram -t 10 -c 1
  resources:
    requests:
      memory: 1g
  dataset_name: 1key-list-500K-elements
  dataset_description: 1 list key preloaded with 500,000 elements.
tested-commands:
- lmpop
redis-topologies:
- oss-standalone
build-variants:
- gcc:15.2.0-amd64-debian-bookworm-default
- gcc:15.2.0-arm64-debian-bookworm-default
- dockerhub
clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: --command="LMPOP 8 lmpop:key:1 lmpop:key:2 lmpop:key:3 lmpop:key:4 lmpop:key:5 lmpop:key:6 lmpop:key:7 lmpop:key:8 LEFT COUNT 1" --hide-histogram -n 100000 --pipeline 1 -c 1 -t 1
  resources:
    requests:
      cpus: '4'
      memory: 2g
tested-groups:
- list
priority: 73
