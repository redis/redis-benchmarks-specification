version: 0.4
name: memtier_benchmark-2keys-zset-500-elements-36B-members-zintercard
description: 'Runs memtier_benchmark issuing ZINTERCARD over 2 sorted sets of 500 elements each
  whose members are 36-byte UUID-shaped strings (8-4-4-4-12 hex, generated deterministically;
  members differ from the first byte, like random UUIDs). All keys hold the identical member set
  (100% overlap), so the reply is always 500. Twin of the 2-key 500-element suite with 3-5 byte
  members: the only change in the queried keys is member length (36 bytes instead of 3-5). Encoding:
  skiplist through 8.10.x, btree (OBJ_ENCODING_BTREE) from 8.12 (every input holds 500 elements,
  above zset-max-listpack-entries 128). Load: memtier defaults (4 threads x 50 clients, pipeline 1),
  the same as the existing ZINTER/ZINTERCARD suites so results line up with them. Unlike the
  existing 2-key and 8-key ZINTERCARD suites, which preload 64 keys, this suite preloads only the 2
  keys it queries. Metric of interest: Ops/sec.'
dbconfig:
  configuration-parameters:
    save: '""'
  check:
    keyspacelen: 2
  resources:
    requests:
      memory: 1g
  init_lua: |
    local function uuid(i)
      -- Deterministic 36-byte UUID-shaped member (8-4-4-4-12 hex). Members differ
      -- from the first byte, like random UUIDs; the last group is i*1000003, so
      -- they are unique.
      return string.format('%08x-%04x-4%03x-%04x-%012x', (i * 2654435761) % 4294967296,
        (i * 40503) % 65536, (i * 2731) % 4096, 32768 + (i * 977) % 16384, i * 1000003)
    end
    -- 2 sorted sets holding the identical 500 UUID-shaped members (36 bytes
    -- each), score = index.
    for k = 1, 2 do
      for m = 1, 500 do
        redis.call('ZADD', 'ov:' .. k, m, uuid(m))
      end
    end
    return 1
  dataset_name: 2keys-sorted-set-500-elements-36B-uuid-members
  dataset_description: 2 sorted sets ov:1..ov:2, each containing the identical 500 36-byte
    UUID-shaped members (score = index).
tested-commands:
- zintercard
redis-topologies:
- oss-standalone
build-variants:
- gcc:15.2.0-amd64-debian-bookworm-default
- gcc:15.2.0-arm64-debian-bookworm-default
- dockerhub
clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: --command="ZINTERCARD 2 ov:1 ov:2 LIMIT 0"  --hide-histogram --test-time 120
  resources:
    requests:
      cpus: '4'
      memory: 2g
tested-groups:
- sorted-set
priority: 131
