version: 0.4
name: memtier_benchmark-1key-zset-500K-elements-zmpop-8keys-bounded
description: 'Runs memtier_benchmark issuing ZMPOP with numkeys=8 against a single populated sorted set of 500,000 elements, using a BOUNDED number of calls. ZMPOP has no coverage today. Only the LAST of the 8 key names is populated: ZMPOP scans the provided keys in order and stops at the first non-empty one, so populating the last key forces all 8 lookups on every call and exercises the numkeys fan-out rather than a single hit. PRELOAD DOMAIN: the ZADD preload has two __key__ occurrences (score and member) and runs -n 50000 across -t 10 threads for 500,000 commands; because each command draws TWO domain positions the key domain is sized at 1,000,000 so the draws do not wrap and collide, giving 500,000 distinct members (verified via ZCARD). The client is bounded to -n 100000 at -c 1 -t 1, i.e. exactly 100,000 pops - 20% of the preload - so the sorted set cannot drain and the suite cannot degenerate into measuring the empty reply. Encoding: skiplist (500,000 elements, exceeds zset-max-listpack-entries 128). Metric of interest: Ops/sec.'
dbconfig:
  configuration-parameters:
    save: '""'
  check:
    keyspacelen: 1
  preload_tool:
    run_image: redislabs/memtier_benchmark:edge
    tool: memtier_benchmark
    arguments: --pipeline 50 --command="ZADD zmpop:key:8 __key__ __key__" --command-key-pattern=P --key-minimum 1 --key-maximum 1000000 --key-prefix "" -n 50000 --hide-histogram -t 10 -c 1
  resources:
    requests:
      memory: 1g
  dataset_name: 1key-sorted-set-500K-elements
  dataset_description: 1 sorted set key preloaded with 500,000 members.
tested-commands:
- zmpop
redis-topologies:
- oss-standalone
build-variants:
- gcc:15.2.0-amd64-debian-bookworm-default
- gcc:15.2.0-arm64-debian-bookworm-default
- dockerhub
clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: --command="ZMPOP 8 zmpop:key:1 zmpop:key:2 zmpop:key:3 zmpop:key:4 zmpop:key:5 zmpop:key:6 zmpop:key:7 zmpop:key:8 MIN COUNT 1" --hide-histogram -n 100000 --pipeline 1 -c 1 -t 1
  resources:
    requests:
      cpus: '4'
      memory: 2g
tested-groups:
- sorted-set
priority: 73
