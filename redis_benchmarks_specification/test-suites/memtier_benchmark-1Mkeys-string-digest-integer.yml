version: 0.4
name: memtier_benchmark-1Mkeys-string-digest-integer
description: |
  Measures Ops/sec of DIGEST on an integer-encoded value (OBJ_ENCODING_INT,
  value 12345, above the shared-integer range). DIGEST first formats the
  integer as a string, then hashes it with XXH3 and formats a 16-character hex
  reply via stringDigest() in src/t_string.c. Read-only: the keyspace is
  unchanged during the run. Pipeline 16 to make per-command overhead visible.
dbconfig:
  configuration-parameters:
    save: '""'
  check:
    keyspacelen: 1000000
  preload_tool:
    run_image: redislabs/memtier_benchmark:edge
    tool: memtier_benchmark
    arguments: '--command "SET __key__ 12345" --command-key-pattern P --key-minimum 1 --key-maximum 1000000 -n allkeys -c 50 -t 2 --pipeline 50 --hide-histogram'
  resources:
    requests:
      memory: 1g
  dataset_name: 1Mkeys-string-integer-12345
  dataset_description: 1 million string keys, each holding the integer 12345 (OBJ_ENCODING_INT).
tested-commands:
- digest
tested-groups:
- string
redis-topologies:
- oss-standalone
build-variants:
- gcc:15.2.0-amd64-debian-bookworm-default
- gcc:15.2.0-arm64-debian-bookworm-default
- dockerhub
clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: '--command "DIGEST __key__" --command-key-pattern R --key-minimum 1 --key-maximum 1000000 --distinct-client-seed --test-time 120 -c 25 -t 8 --pipeline 16 --hide-histogram'
  resources:
    requests:
      cpus: '8'
      memory: 2g
priority: 1
