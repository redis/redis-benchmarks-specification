version: 0.4
name: memtier_benchmark-2keys-zset-500-elements-10pct-overlap-zintercard
description: 'Runs memtier_benchmark issuing ZINTERCARD over 2 sorted sets of 500 elements each with
  low (10%) overlap: 50 members (s:1..s:50, at every 10th score position) are shared by all keys and
  the remaining 450 per key are unique to it (u:<key>:<pos>), 3-7 byte members. The reply is always
  50; 90% of candidates are rejected by the first lookup, and the hits sit at a fixed repeating
  position (every 10th candidate in iteration order). It adds low-overlap coverage alongside the
  100%-overlap 2-key suite. Encoding: skiplist through 8.10.x, btree (OBJ_ENCODING_BTREE) from 8.12
  (every input holds 500 elements, above zset-max-listpack-entries 128). Load: memtier defaults (4
  threads x 50 clients, pipeline 1), the same as the existing ZINTER/ZINTERCARD suites so results
  line up with them. Unlike the existing 2-key and 8-key ZINTERCARD suites, which preload 64 keys,
  this suite preloads only the 2 keys it queries. Metric of interest: Ops/sec.'
dbconfig:
  configuration-parameters:
    save: '""'
  check:
    keyspacelen: 2
  resources:
    requests:
      memory: 1g
  init_lua: |
    -- Each key holds 500 members ordered by score 1..500. Every 10th position
    -- (score 10, 20, ..., 500) is a shared member s:1..s:50 present in all keys;
    -- the other 450 positions are unique to the key (u:<key>:<pos>). The
    -- intersection is exactly the 50 shared members (10% overlap), and the hits
    -- sit at a fixed repeating position (every 10th candidate in iteration order).
    for k = 1, 2 do
      for pos = 1, 500 do
        if pos % 10 == 0 then
          redis.call('ZADD', 'ov:' .. k, pos, 's:' .. (pos / 10))
        else
          redis.call('ZADD', 'ov:' .. k, pos, 'u:' .. k .. ':' .. pos)
        end
      end
    end
    return 1
  dataset_name: 2keys-sorted-set-500-elements-10pct-overlap
  dataset_description: 2 sorted sets ov:1..ov:2 of 500 members; 50 shared (s:1..s:50) plus 450
    unique per key. Intersection = 50.
tested-commands:
- zintercard
redis-topologies:
- oss-standalone
build-variants:
- gcc:15.2.0-amd64-debian-bookworm-default
- gcc:15.2.0-arm64-debian-bookworm-default
- dockerhub
clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: --command="ZINTERCARD 2 ov:1 ov:2 LIMIT 0"  --hide-histogram --test-time 120
  resources:
    requests:
      cpus: '4'
      memory: 2g
tested-groups:
- sorted-set
priority: 131
